[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgxarley"
dynamic = ["version"]
requires-python = ">=3.14"
readme = "README_pypi.md"
authors = [
  { name="Henning Thieß", email="ht@xomox.cc" },
]
license-files = ["LICENSE.md"]
keywords = ["llm", "inference", "sglang", "ollama", "openwebui", "dgx", "k3s", "streaming", "repetition-detection"]
description = "Integration testing, streaming utilities, and repetition detection for distributed LLM inference on DGX Spark clusters"

# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 4 - Beta",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",

    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",

    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: POSIX :: Linux",
]


dependencies = [
    "requests",
    "rich",
    "aiohttp",
    "PyYAML",
    "ascii-magic",
    "Pillow",
    "pydantic",
    "loguru",
    "tabulate",
    "pyserial",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "mypy",
    "black",
    "isort",
    "types-requests",
    "types-PyYAML",
    # "sglang" — REMOVED 2026-08-02, see the note in requirements-dev.txt.
    # Upstream ships no cp314 wheel and no sdist since v0.5.11, so this pin made
    # `pip install -e .[dev]` unresolvable on this project's own requires-python
    # (>=3.14). mypy covers it via the `sglang.*` override below; the bench
    # wrapper's imports are function-local. Use the `sglang-bench` extra instead.
    "typer",
    "types-pyserial"
    # torch is installed via requirements-dev.txt with --extra-index-url
    # (PyTorch cu129 wheel index) — cannot be specified here in pyproject.toml
]
# Runtime deps for dgxarley.integration.sglang_bench (the bench_serving launcher).
# sglang pulls in transformers + pybase64 at import time, typer drives the CLI.
# NOTE: needs CPython 3.10–3.13 (no cp314 sglang wheel upstream as of 2026-08-02).
sglang-bench = [
    "sglang",
    "transformers",
    "pybase64",
    "typer",
]
web = [
    "fastapi",
    "uvicorn[standard]",
]
ansible = [
    "jinja2",
    "kubernetes",
    "dnspython",
    "pygithub",
    "huggingface-hub",
    "paramiko",
    "ansible",
    "ansible-pylibssh",
]
build = [
    "hatch",
]
# Runtime deps for dgxarley.k3shelperstuff.keel_drift (the Keel drift check).
# update_local_k3s_keys needs nothing beyond the standard library.
k3s = [
    "kubernetes",
    "typer",
]

[project.urls]
Homepage = "https://github.com/vroomfondel/dgxarley"
Repository = "https://github.com/vroomfondel/dgxarley"
Issues = "https://github.com/vroomfondel/dgxarley/issues"



[tool.hatch.version]
path = "dgxarley/__init__.py"

# ---------------------------------------------------------------------------
# Build file selection: EXPLICIT ALLOWLIST, do not switch back to defaults.
#
# This repo is an Ansible repo *and* a Python package: most of the working tree
# is deployment config that has no business in a published artifact, and the
# default "ship everything not gitignored" behaviour does not know that.
#
# Keep these lists as an allowlist (`include`), never as a denylist (`exclude`):
# a new path must not be able to ship just because nobody remembered to exclude
# it. repo_scripts/check_dist_secrets.py enforces this on the built artifacts
# and is wired into `make pypibuild` / `make pypipush`.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.sdist]
include = [
  "/dgxarley",
  "/tests",
  "/pyproject.toml",
  "/README_pypi.md",
  "/LICENSE.md",
]

[tool.hatch.build.targets.wheel]
packages = ["dgxarley"]

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ["py313"]
#extend-exclude = '''
#(?x)(
#    automowerclient
#    | husqvarnaauth
#)
#'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "tests/*.py"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = '''(?x)(
    \.venv
    | venv
    | \.pyi$
    | ^roles/k8s_infra/files/hermes_email_gateway_patched\.py$
    | ^roles/k8s_infra/files/hindsight_tenant_keymap\.py$
    | ^roles/k8s_infra/files/hermes_image_gen_comfyui/
    # Unpacked distribution artifacts kept for local inspection. They contain a
    # second copy of this package, which mypy reports as a duplicate module.
    | \.local/
    )'''

[[tool.mypy.overrides]]
module = [
    "cv2", "numpy", "pytesseract",
    "aiohttp", "ascii_magic", "uvicorn", "fastapi", "fastapi.*",
    "sglang.*", "safetensors", "safetensors.*",
    "kubernetes", "kubernetes.*",
]
ignore_missing_imports = true


[project.scripts]
sglang-raw = "dgxarley.integration.sglang_raw:main"
sglang-bench = "dgxarley.integration.sglang_bench:main"
sglang-test = "dgxarley.integration.sglang_integration_test:main"
openwebui-test = "dgxarley.integration.openwebui_integration_test:main"
ollama-test = "dgxarley.integration.ollama_integration_test:main"
comfyui-test = "dgxarley.integration.comfyui_integration_test:main"
kceve-kvm = "dgxarley.tools.kceve_kvm:main"
kceve-kvm-web = "dgxarley.tools.kceve_kvm_web:main"
kceve-kvm-web-plain = "dgxarley.tools.kceve_kvm_web_plain:main"
keel-drift = "dgxarley.k3shelperstuff.keel_drift:app"
k3s-keys-sync = "dgxarley.k3shelperstuff.update_local_k3s_keys:main"
