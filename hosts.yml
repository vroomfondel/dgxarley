---
dgxcluster:
  children:
    k3sserver:
    dgxsparks:
    fullvlans:

k3sserver:
  hosts:
    k3smaster:
      # Address, clevis and network in host_vars/k3smaster/

      # NOTE(2026-08-03): the former `isk3sserver` flag was removed from every host --
      # no task or template ever read it. Membership in the `k3sserver` group below is
      # what carries the k3s-node semantics, and it is about far more than the k3s
      # install: the group drives the `k3snodes` ipset and the k3s rule block in
      # roles/common/templates/iptables.sh.j2, the boot-time firewall path in
      # rc_local.j2 (in-group: run /root/iptables.sh; out-of-group: only restore
      # /root/iptables.save), `localnets_k3sserver` (pod CIDR), ulogd2, the
      # ip_nonlocal_bind sysctl, and the host pattern of storage.yml (JuiceFS).
      # A host that must keep all of that but must NOT become a k3s node therefore
      # stays in the group and sets `install_k3s: false` (spark5) -- see
      # group_vars/k3sserver/main/k3s.yml. Only `isk3smaster` is load-bearing
      # (haproxy, rustfs_client, k8s_infra import, k3s config server/agent, iptables
      # 6443/6720, JuiceFS master mount).
      isk3smaster: true
      hw_iface: "enx6c1ff7c1da8d"
      wantsnetplan: true
      fail2ban_sendermail: "fail2ban@{{ mailname }}"
      wantsopenvswitch: true
      ovs_bridge_iface: "enx6c1ff7c1da8d"
      wantsclevis: true
      wantsnut: true

      # K3s Node-Labels
      k3s_node_labels:
        - "node-role=k3smaster"
        - "kubernetes.io/arch=amd64"

      # Keine GPU
      has_nvidia_gpu: false

      # smartd (falls Festplatten vorhanden)
      smartd_devices:
        - { device: "/dev/nvme0n1", type: "nvme" }
        - { device: "/dev/disk/by-id/usb-Intenso_External_USB_3.0_2023100730024-0:0", driver: "sat" }
    spark1:
      # Address, clevis and network in host_vars/spark1/

      wantsclevis: true
      hw_iface: "enP7s7"
      wantsnetplan: true
      isdgxspark: true
      spark_id: 1
      is_sglang_head: true
      fail2ban_sendermail: "fail2ban@{{ mailname }}"

      # Netzwerk — OVS Bridge auf enP7s7
      ovs_bridge_iface: "enP7s7"

      # K3s
      k3s_node_labels:
        - "spark-id={{ spark_id }}"
        - "nvidia.com/gpu.present=true"
        - "kubernetes.io/arch=arm64"

      has_nvidia_gpu: true

      # smartd
      smartd_devices:
        - { device: "/dev/nvme0n1", type: "nvme" }
    spark2:
      # Address, clevis and network in host_vars/spark2/

      wantsclevis: true
      hw_iface: "enP7s7"
      wantsnetplan: true
      isdgxspark: true
      spark_id: 2
      is_sglang_head: false
      fail2ban_sendermail: "fail2ban@{{ mailname }}"

      # Netzwerk — OVS Bridge auf enP7s7
      ovs_bridge_iface: "enP7s7"

      # K3s
      k3s_node_labels:
        - "spark-id={{ spark_id }}"
        - "nvidia.com/gpu.present=true"
        - "kubernetes.io/arch=arm64"

      has_nvidia_gpu: true

      # smartd
      smartd_devices:
        - { device: "/dev/nvme0n1", type: "nvme" }
    spark3:
      # Address, clevis and network in host_vars/spark3/

      wantsclevis: true
      hw_iface: "enP7s7"
      wantsnetplan: true
      isdgxspark: true
      spark_id: 3
      is_sglang_head: false
      fail2ban_sendermail: "fail2ban@{{ mailname }}"

      # Netzwerk — OVS Bridge auf enP7s7
      ovs_bridge_iface: "enP7s7"

      # K3s
      k3s_node_labels:
        - "spark-id={{ spark_id }}"
        - "nvidia.com/gpu.present=true"
        - "kubernetes.io/arch=arm64"

      has_nvidia_gpu: true

      # smartd
      smartd_devices:
        - { device: "/dev/nvme0n1", type: "nvme" }
    spark4:
      # Address, clevis and network in host_vars/spark4/

      wantsclevis: true
      hw_iface: "enP7s7"
      wantsnetplan: true
      isdgxspark: true
      spark_id: 4
      is_sglang_head: false
      fail2ban_sendermail: "fail2ban@{{ mailname }}"

      # Netzwerk — OVS Bridge auf enP7s7
      ovs_bridge_iface: "enP7s7"

      # K3s
      k3s_node_labels:
        - "spark-id={{ spark_id }}"
        - "nvidia.com/gpu.present=true"
        - "kubernetes.io/arch=arm64"

      has_nvidia_gpu: true

      # smartd
      smartd_devices:
        - { device: "/dev/nvme0n1", type: "nvme" }

    spark5:
      # Address, clevis and network in host_vars/spark5/

      wantsclevis: true
      hw_iface: "enP7s7"
      wantsnetplan: true
      isdgxspark: true
      spark_id: 5
      is_sglang_head: false
      # Build/verify host, NOT a cluster node: no k3s here (podman harness for the
      # sm121 image builds and the patch tree-diff). It deliberately STAYS in the
      # `k3sserver` group so it keeps the group's firewall semantics (k3snodes ipset
      # on the other nodes, the k3s rule block incl. the throwaway registry on :5000,
      # the rc.local boot path) and stays in scope for storage.yml. See the NOTE at
      # the top of this group.
      install_k3s: false
      # Overrides the group's `wantsnfsmount: true`: no /mnt/nfs + /mnt/nfs-HF-CACHE
      # client mounts on the build host. It serves no pods, and the HF cache it does
      # need comes from JuiceFS, not from the master's NFS export.
      wantsnfsmount: false
      # QSFP not cabled yet -> can't reach the JuiceFS backend on spark4.
      # Remove this line once spark5 is in the QSFP mesh.
      juicefs_mount_enabled: false
      standalone_sglang_firewall_enabled: true
      fail2ban_sendermail: "fail2ban@{{ mailname }}"

      # Netzwerk — OVS Bridge auf enP7s7
      ovs_bridge_iface: "enP7s7"

      # K3s
      k3s_node_labels:
        - "spark-id={{ spark_id }}"
        - "nvidia.com/gpu.present=true"
        - "kubernetes.io/arch=arm64"

      has_nvidia_gpu: true

      # smartd
      smartd_devices:
        - { device: "/dev/nvme0n1", type: "nvme" }

dgxsparks:
  hosts:
    spark1:
      # Address, clevis and network in host_vars/spark1/
    spark2:
      # Address, clevis and network in host_vars/spark2/
    spark3:
      # Address, clevis and network in host_vars/spark3/
    spark4:
      # Address, clevis and network in host_vars/spark4/
    spark5:
      # Address, clevis and network in host_vars/spark5/

fullvlans:
  hosts:
    k3smaster:
      # Address, clevis and network in host_vars/k3smaster/

switches:
  hosts:
    mikrotik-CRS310-8G-2S:
      # Address, login and serial in host_vars/mikrotik-CRS310-8G-2S/
      ansible_connection: ansible.netcommon.network_cli
      ansible_network_os: community.routeros.routeros
      qsfp_switch: false
    mikrotik-CRS812-8DS-2DQ-2DDQ-RM:
      # Address, login and serial in host_vars/mikrotik-CRS812-8DS-2DQ-2DDQ-RM/
      ansible_connection: ansible.netcommon.network_cli
      ansible_network_os: community.routeros.routeros
      qsfp_switch: true

# empty group defs.
hetzner:
hetznercloudnew:
dnsserver:
disabled: