---
# Marker for the comments/lists uplink.yml, wireguard.yml and routing.yml look up their objects by; letters, digits, - and _ only.
mikrotik_object_prefix: ansible
mikrotik_internal_list: "{{ mikrotik_object_prefix }}-internal"

# /system identity; empty = not managed. Same rule as mikrotik_bootstrap.py --identity (NAME_RE).
mikrotik_identity: ""

# Settings dicts: inventory sets <name> (partial is fine), tasks/main.yml merges it over <name>_defaults into _<name>.
mikrotik_bridge: {}
# vlan_ports: [{name, vlan_id, interface, allowed_macs, comment?}] tagged VLAN on a non-bridge port (e.g. the uplink trunk)
# joined to the bridge; bridge filters pass only frames from/to allowed_macs plus ARP broadcast towards them.
mikrotik_bridge_defaults:
  name: bridge
  ports: []
  vlans: []
  vlan_ports: []
mikrotik_bridge_vlan_port_comment: "{{ mikrotik_object_prefix }}-bvp"

mikrotik_management: {}
mikrotik_management_defaults:
  interfaces: []

# default_gateway is also used by the static uplink; without an uplink it becomes the default route.
# allow_remote_dns_requests: null = not managed; true also drops port 53 input on every interface but the bridge.
# dns_static: [{name, address, aliases}] A records (each alias gets its own record); adopts same-named entries, removes stale managed ones.
mikrotik_routing: {}
mikrotik_routing_defaults:
  default_gateway: ""
  dns_servers: []
  allow_remote_dns_requests: null
  dns_static: []

mikrotik_nat: {}
mikrotik_nat_defaults:
  srcnat_rules: []

# static_leases: [{name, mac, address, server}]; adopts the lease with that MAC (dynamic ones are made static), removes stale managed ones.
mikrotik_dhcp: {}
mikrotik_dhcp_defaults:
  servers: []
  static_leases: []

mikrotik_cve_2026_98432_mitigation: true
mikrotik_cve_2026_98432_comment: "cve-2026-98432: drop IPv4 TCP with IP options"

# /ip/firewall rules do not cover IPv6; the stack stays off unless /ipv6/firewall/filter gets its own rules.
mikrotik_disable_ipv6: true

mikrotik_firewall: {}
mikrotik_firewall_defaults:
  fasttrack_enabled: false

# Routed uplink into the upstream LAN (tasks/uplink.yml); empty interface = not managed.
# port_forwards: dst-nat from the uplink address to LAN hosts, [{to_address, tcp_ports (max 15), tcp_port_map}]; derived from lan_ingress
# (group_vars/all/main/lan_ingress.yml), which also opens the ports on the target and allowlists the networks in Traefik.
mikrotik_uplink: {}
mikrotik_uplink_defaults:
  interface: ""
  mode: dhcp
  address: ""
  comment: "{{ mikrotik_object_prefix }}-uplink"
  use_peer_dns: true
  port_forwards: "{{ [{'to_address': lan_ingress_target_address, 'tcp_ports': lan_ingress.tcp_ports, 'tcp_port_map': lan_ingress.tcp_port_map | default([])}] if lan_ingress.enabled | default(false) | bool else [] }}"

# RoCE/RDMA lossless Ethernet, only active when qsfp_switch: true
mikrotik_qsfp: {}
mikrotik_qsfp_defaults:
  roce_ports: []
  mtu: 9000
  l2mtu: 9500
  roce_dscp_data: 26
  roce_dscp_cnp: 48
  roce_traffic_class: 3
  cnp_traffic_class: 6

# forward_lans: network CIDRs (not interface addresses); never the uplink VLAN, that is the upstream LAN.
# hub_tcp_ports: TCP ports on the hub (hub_address) that LAN hosts may open through the tunnel, e.g. the mail relay;
# src-NATed to the Mikrotik's tunnel address so the hub accepts it regardless of forward_lan. [] = none.
# hub_address: empty = first host of the ops subnet (.1, IPv4, prefix >= /24).
mikrotik_wireguard: {}
mikrotik_wireguard_defaults:
  enabled: false
  teardown: false
  interface: "wg-{{ mikrotik_object_prefix }}"
  comment: "{{ mikrotik_object_prefix }}-hub"
  hub_endpoint: ""
  hub_public_key: ""
  hub_address: ""
  tunnel_address: ""
  ops_subnet: ""
  keepalive: 25s
  forward_lan: false
  forward_lans: []
  hub_tcp_ports: [25, 587]
  input_tcp_ports: [22, 8291]
