---
# =============================================================================
# GRAFANA IMAGE RENDERER (remote rendering service)
# =============================================================================
# Runs Chromium in its OWN pod instead of as the in-process
# `grafana-image-renderer` plugin: the plugin variant has to fit a browser into
# grafana's own memory limit (already ~500Mi of 950Mi in steady state) and takes
# grafana down with it on an OOM. Grafana reaches it over HTTP via
# GF_RENDERING_SERVER_URL and hands it GF_RENDERING_CALLBACK_URL to fetch the
# panel back from.
# `grafana_image_renderer_enabled: false` only skips the install (and blanks
# GF_RENDERING_SERVER_URL so grafana stops calling it); removal is the opt-in
# `-e grafana_image_renderer_teardown=true` with `--tags grafana`.

- name: Resolve grafana image renderer install gate
  ansible.builtin.set_fact:
    # Needed as a fact, not a block gate: the renderer objects and the grafana
    # env vars that point at them live in two separate places in this file.
    grafana_renderer_install: "{{ (grafana_image_renderer_enabled | default(true) | bool) and not (grafana_image_renderer_teardown | default(false) | bool) }}"

- name: Grafana image renderer — install
  when: grafana_renderer_install | bool
  block:
    - name: Create grafana-image-renderer-secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-image-renderer-secrets
            namespace: monitoring
          type: Opaque
          stringData:
            # Shared secret for /render, sent by grafana as X-Auth-Token. Same
            # variable on both sides so they cannot drift; it must not be the
            # upstream default "-" or grafana refuses to start (see the derived
            # default in defaults/main/monitoring.yml).
            AUTH_TOKEN: "{{ grafana_image_renderer_auth_token }}"
      register: grafana_renderer_secrets

    - name: Create grafana-image-renderer Deployment
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: grafana-image-renderer
            namespace: monitoring
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: grafana-image-renderer
            template:
              metadata:
                labels:
                  app: grafana-image-renderer
                annotations:
                  checksum/config: "{{ grafana_renderer_secrets.result.data | to_json | hash('sha256') }}"
                  keel.sh/policy: force
                  keel.sh/match-tag: "true"
                  keel.sh/pollSchedule: "@every 24h"
                  keel.sh/trigger: poll
              spec:
                nodeSelector:
                  kubernetes.io/arch: amd64
                securityContext:
                  runAsUser: 472
                  runAsGroup: 472
                  runAsNonRoot: true
                containers:
                - name: renderer
                  image: "{{ grafana_image_renderer_image }}"
                  # Explicit: the image is unpinned, and keel's force policy only
                  # picks up a new digest if the kubelet actually re-pulls.
                  imagePullPolicy: Always
                  ports:
                  - name: http
                    containerPort: 8081
                  env:
                    # v5 is a Go rewrite with a different env surface than the
                    # Node service most docs still describe: RENDERING_MODE and
                    # ENABLE_METRICS do not exist in the binary (verified with
                    # `grafana-image-renderer server --help`), /metrics is
                    # always on, and there is no reusable/clustered browser
                    # mode — a Chromium is launched per request.
                    - name: HTTP_HOST
                      value: "0.0.0.0"
                    - name: HTTP_PORT
                      value: "8081"
                    - name: LOG_LEVEL
                      value: "{{ grafana_image_renderer_log_level }}"
                  envFrom:
                  - secretRef:
                      name: grafana-image-renderer-secrets
                  volumeMounts:
                  # Chromium puts its renderer shared memory here. The container
                  # runtime default of 64Mi makes it crash on larger panels.
                  - name: dshm
                    mountPath: /dev/shm
                  readinessProbe:
                    httpGet:
                      path: /
                      port: http
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  livenessProbe:
                    httpGet:
                      path: /
                      port: http
                    initialDelaySeconds: 30
                    periodSeconds: 30
                  securityContext:
                    allowPrivilegeEscalation: false
                  resources:
                    # Limits only — requests stay small so nothing is reserved
                    # on k3smaster. A single render peaks around 1.1 GB across
                    # its ~11 Chromium processes, so a 1Gi limit sits right on
                    # the edge. At a 1-core limit the cgroup was throttled for
                    # 5-11s of every render (cpu.stat), hence the wider ceiling.
                    requests:
                      cpu: 100m
                      memory: 200Mi
                    limits:
                      cpu: "{{ grafana_image_renderer_cpu_limit }}"
                      memory: "{{ grafana_image_renderer_memory_limit }}"
                volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                    # Counts against the container memory limit above.
                    sizeLimit: 256Mi

    - name: Create grafana-image-renderer Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: grafana-image-renderer
            namespace: monitoring
          spec:
            selector:
              app: grafana-image-renderer
            type: ClusterIP
            ports:
            - port: 8081
              targetPort: http

- name: Grafana image renderer — teardown
  when: grafana_image_renderer_teardown | default(false) | bool
  block:
    - name: Remove grafana image renderer objects
      kubernetes.core.k8s:
        state: absent
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        name: grafana-image-renderer
        namespace: monitoring
      loop:
        - { api_version: "apps/v1", kind: Deployment }
        - { api_version: "v1", kind: Service }

    - name: Remove grafana-image-renderer-secrets
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: grafana-image-renderer-secrets
        namespace: monitoring

# =============================================================================
# GRAFANA SECRETS (local auth — no Keycloak OIDC)
# =============================================================================

- name: Create grafana-secrets with local auth configuration
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-secrets
        namespace: monitoring
      type: Opaque
      stringData:
        GF_SECURITY_ADMIN_USER: 'admin'
        GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
        GF_SECURITY_ALLOW_EMBEDDING: 'true'
        GF_SECURITY_COOKIE_SAMESITE: 'disabled'
        GF_AUTH_ANONYMOUS_ENABLED: 'false'
        GF_SERVER_ROOT_URL: "{{ grafana_root_url }}"
        # Remote image rendering (PNG panel export, alert screenshots). Blank
        # when the renderer is not installed: the keys stay in the Secret
        # either way because a strategic-merge patch cannot prune a key that is
        # dropped from stringData, and blank == grafana's own "no renderer".
        # The callback URL is what the renderer fetches the panel back from, so
        # it must be grafana's in-cluster address, not the public root_url.
        GF_RENDERING_SERVER_URL: "{{ grafana_renderer_install | bool | ternary('http://grafana-image-renderer.monitoring.svc.cluster.local:8081/render', '') }}"
        GF_RENDERING_CALLBACK_URL: "http://grafana.monitoring.svc.cluster.local:3000/"
        GF_RENDERING_RENDERER_TOKEN: "{{ grafana_image_renderer_auth_token }}"
  register: grafana_secrets

# =============================================================================
# GRAFANA RESOURCES (ConfigMaps, Deployment, Service, Ingress)
# =============================================================================

- name: Create grafana-provisioning ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-provisioning
        namespace: monitoring
      data:
        datasources.yaml: |
          apiVersion: 1
          deleteDatasources:
            - name: Prometheus
              orgId: 1
          datasources:
          - name: Prometheus
            type: prometheus
            url: http://prometheus.monitoring.svc.cluster.local:9090
            access: proxy
            isDefault: true
            uid: prometheus
            jsonData:
              httpMethod: POST
              manageAlerts: true
              prometheusType: Prometheus
              prometheusVersion: "3.9.1"
        dashboards.yaml: |
          apiVersion: 1
          providers:
          - name: 'Default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              # MUST be the provisioned/ SUBDIR, not the mount root. The file
              # provider scans its path RECURSIVELY; pointing it at the root
              # would also pick up the raw-upstream cache in src/ (same uids →
              # duplicate/!wrong dashboards). See download-dashboards.sh.
              path: /var/lib/grafana/dashboards/provisioned
  register: grafana_provisioning

- name: Create grafana-download-dashboards-script ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-download-dashboards-script
        namespace: monitoring
      data:
        download-dashboards.sh: "{{ lookup('file', role_path ~ '/files/download-dashboards.sh') }}"
  register: grafana_dashboards_script

- name: Create grafana Deployment
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
        namespace: monitoring
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: grafana
        template:
          metadata:
            labels:
              app: grafana
            annotations:
              checksum/config: "{{ (grafana_secrets.result.data | to_json + grafana_provisioning.result.data | to_json + grafana_dashboards_script.result.data | to_json) | hash('sha256') }}"
              kubectl.kubernetes.io/default-container: "grafana"
              keel.sh/policy: force
              keel.sh/match-tag: "true"
              keel.sh/pollSchedule: "@every 24h"
              keel.sh/trigger: poll
          spec:
            nodeSelector:
              kubernetes.io/arch: amd64
            dnsConfig:
              options:
                - name: ndots
                  value: "2"
            initContainers:
            - name: fix-permissions
              image: busybox
              command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana"]
              volumeMounts:
              - name: grafana-storage
                mountPath: /var/lib/grafana
            - name: download-dashboards
              image: alpine:latest
              command: ["/bin/sh", "/scripts/download-dashboards.sh"]
              env:
                - name: GRAFANA_DASHBOARD_CACHE_TTL_DAYS
                  value: "{{ grafana_dashboard_cache_ttl_days | default(7) | string }}"
                # Gates the JuiceFS + Valkey dashboard blocks in the (static,
                # non-templated) download script — see download-dashboards.sh.
                # Coupled to the master switch so no dashboards appear for a
                # not-yet-deployed filesystem.
                - name: JUICEFS_DASHBOARDS_ENABLED
                  value: "{{ (juicefs_enabled | default(false) | bool and juicefs_metrics_enabled | default(false) | bool) | string | lower }}"
              volumeMounts:
              - name: download-script
                mountPath: /scripts
              - name: grafana-dashboards
                mountPath: /var/lib/grafana/dashboards
            containers:
            - name: grafana
              image: grafana/grafana:13.3.1-ubuntu
              ports:
              - name: grafanaport
                containerPort: 3000
              envFrom:
              - secretRef:
                  name: grafana-secrets
              volumeMounts:
              - name: grafana-storage
                mountPath: /var/lib/grafana
              - name: grafana-provisioning
                mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
                subPath: datasources.yaml
              - name: grafana-provisioning
                mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
                subPath: dashboards.yaml
              - name: grafana-dashboards
                mountPath: /var/lib/grafana/dashboards
              resources:
                requests:
                  cpu: 250m
                  memory: 250Mi
                limits:
                  cpu: 2000m
                  memory: 950Mi
            volumes:
            - name: download-script
              configMap:
                name: grafana-download-dashboards-script
                defaultMode: 0755
            - name: grafana-storage
              hostPath:
                path: /var/lib/k8s-data/grafana
                type: DirectoryOrCreate
            - name: grafana-provisioning
              configMap:
                name: grafana-provisioning
            - name: grafana-dashboards
              hostPath:
                path: /var/lib/k8s-data/grafana-dashboards
                type: DirectoryOrCreate

- name: Create grafana Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: grafana
        namespace: monitoring
      spec:
        selector:
          app: grafana
        type: ClusterIP
        ports:
        - port: 3000
          targetPort: grafanaport

- name: Create grafana HTTP IngressRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: grafanahttpingress
        namespace: monitoring
      spec:
        entryPoints:
          - web
        routes:
        - kind: Rule
          match: "Host(`promgrafana.{{ dns_external_domain_suffix }}`)"
          priority: 10
          services:
          - kind: Service
            name: grafana
            namespace: monitoring
            passHostHeader: true
            port: 3000
          middlewares:
            - name: ip-source-limiter
              namespace: monitoring
            - name: redirect-myhttps
              namespace: monitoring

- name: Create grafana TLS Certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "promgrafana.{{ dns_external_domain_suffix }}"
        namespace: monitoring
      spec:
        dnsNames:
          - "promgrafana.{{ dns_external_domain_suffix }}"
        secretName: "promgrafana.{{ dns_external_domain_suffix }}"
        issuerRef:
          name: letsencrypt-production
          kind: ClusterIssuer

- name: Create grafana HTTPS IngressRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: pghttpsingress
        namespace: monitoring
      spec:
        entryPoints:
          - websecure
        routes:
          - kind: Rule
            match: "Host(`promgrafana.{{ dns_external_domain_suffix }}`)"
            priority: 10
            services:
            - kind: Service
              name: grafana
              namespace: monitoring
              passHostHeader: true
              port: 3000
            middlewares:
              - name: ip-source-limiter
                namespace: monitoring
        tls:
          secretName: "promgrafana.{{ dns_external_domain_suffix }}"

- name: Register DNS A record for promgrafana
  community.general.nsupdate:
    record: "promgrafana.{{ dns_external_domain_suffix }}."
    type: A
    value: "{{ nsupdate_default.ingress_ip }}"
    state: present
