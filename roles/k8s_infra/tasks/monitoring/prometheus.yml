---
# =============================================================================
# PROMETHEUS (RBAC, ConfigMap, Deployment, Service, Ingress)
# =============================================================================

- name: Create prometheus ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: prometheus
        namespace: monitoring

- name: Create prometheus ClusterRole
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: prometheus
      rules:
      - apiGroups: [""]
        resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "pods", "endpointslices"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["discovery.k8s.io"]
        resources: ["endpointslices"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["extensions"]
        resources: ["ingresses"]
        verbs: ["get", "list", "watch"]
      - nonResourceURLs: ["/metrics"]
        verbs: ["get"]

- name: Create prometheus ClusterRoleBinding
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: prometheus
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: prometheus
      subjects:
      - kind: ServiceAccount
        name: prometheus
        namespace: monitoring

- name: Create prometheus-config ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: prometheus-config
        namespace: monitoring
      data:
        prometheus.yml: "{{ lookup('template', 'monitoring_prometheus.yml.j2') }}"
        alert_rules.yml: "{{ lookup('template', 'monitoring_prometheus_alert_rules.yml.j2') }}"
  register: prometheus_config

- name: Create prometheus Deployment
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prometheus
        namespace: monitoring
      spec:
        replicas: 1
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app: prometheus
        template:
          metadata:
            labels:
              app: prometheus
            annotations:
              checksum/config: "{{ prometheus_config.result.data | to_json | hash('sha256') }}"
              keel.sh/policy: patch
              keel.sh/match-tag: "true"
              keel.sh/pollSchedule: "@every 24h"
              keel.sh/trigger: poll
          spec:
            nodeSelector:
              kubernetes.io/arch: amd64
            dnsConfig:
              options:
                - name: ndots
                  value: "2"
            serviceAccountName: prometheus
            initContainers:
            - name: fix-permissions
              image: busybox
              command: ["sh", "-c", "chown -R 65534:65534 /prometheus"]
              volumeMounts:
              - name: prometheus-storage-volume
                mountPath: /prometheus/
            containers:
            - name: prometheus
              image: prom/prometheus:v3.14.0
              args:
                - "--config.file=/etc/prometheus/prometheus.yml"
                - "--storage.tsdb.path=/prometheus/"
                - "--storage.tsdb.retention.time=7d"
                - "--web.enable-lifecycle"
              ports:
              - name: prometheusport
                containerPort: 9090
              volumeMounts:
              - name: prometheus-config-volume
                mountPath: /etc/prometheus/
              - name: prometheus-storage-volume
                mountPath: /prometheus/
              resources:
                requests:
                  cpu: 250m
                  memory: 640Mi
                limits:
                  cpu: 1250m
                  memory: 1Gi
            volumes:
            - name: prometheus-config-volume
              configMap:
                name: prometheus-config
            - name: prometheus-storage-volume
              hostPath:
                path: /var/lib/k8s-data/prometheus
                type: DirectoryOrCreate

- name: Create prometheus Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: prometheus
        namespace: monitoring
      spec:
        selector:
          app: prometheus
        type: ClusterIP
        ports:
        - port: 9090
          targetPort: prometheusport

- name: Create prometheus HTTP IngressRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: prometheusingress
        namespace: monitoring
      spec:
        entryPoints:
          - web
        routes:
        - kind: Rule
          match: "Host(`prometheus.{{ dns_external_domain_suffix }}`)"
          priority: 10
          services:
          - kind: Service
            name: prometheus
            namespace: monitoring
            passHostHeader: true
            port: 9090
          middlewares:
            - name: ip-source-limiter
              namespace: monitoring
            - name: redirect-myhttps
              namespace: monitoring

- name: Create prometheus TLS Certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "prometheus.{{ dns_external_domain_suffix }}"
        namespace: monitoring
      spec:
        dnsNames:
          - "prometheus.{{ dns_external_domain_suffix }}"
        secretName: "prometheus.{{ dns_external_domain_suffix }}"
        issuerRef:
          name: letsencrypt-production
          kind: ClusterIssuer

- name: Create prometheus HTTPS IngressRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: prometheushttpsingress
        namespace: monitoring
      spec:
        entryPoints:
          - websecure
        routes:
          - kind: Rule
            match: "Host(`prometheus.{{ dns_external_domain_suffix }}`)"
            priority: 10
            services:
              - kind: Service
                name: prometheus
                namespace: monitoring
                passHostHeader: true
                port: 9090
            middlewares:
              - name: ip-source-limiter
                namespace: monitoring
        tls:
          secretName: "prometheus.{{ dns_external_domain_suffix }}"

- name: Register DNS A record for prometheus
  community.general.nsupdate:
    server: "{{ nsupdate_server }}"
    zone: "{{ nsupdate_zone }}"
    key_name: "{{ nsupdate_tsig_key_name }}"
    key_secret: "{{ nsupdate_tsig_key_secret }}"
    key_algorithm: "{{ nsupdate_tsig_algorithm }}"
    record: "prometheus.{{ dns_external_domain_suffix }}."
    type: A
    ttl: "{{ nsupdate_ttl }}"
    value: "{{ nsupdate_ingress_ip }}"
    state: present
