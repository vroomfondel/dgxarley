---
# =============================================================================
# ALERTMANAGER (Secret, ConfigMaps, Gotify Bridge, Deployments, Services)
# =============================================================================

- name: Create alertmanager-secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: alertmanager-secrets
        namespace: monitoring
      type: Opaque
      stringData:
        SMTP_SMARTHOST: "{{ alertmanager_smtp_smarthost }}"
        SMTP_MAILFROM: "{{ alertmanager_smtp_mailfrom }}"
        ALERT_EMAIL: "{{ alertmanager_alert_email }}"
        GOTIFY_TOKEN: "{{ alertmanager_gotify_token }}"
        GOTIFY_URL: "{{ alertmanager_gotify_url }}"

- name: Create alertmanager-config ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: alertmanager-config
        namespace: monitoring
      data:
        alertmanager.yml: "{{ lookup('template', 'monitoring_alertmanager.yml.j2') }}"
  # Registered for the Deployment's checksum/config annotation below — without it
  # a config-only change updates the ConfigMap but never rolls the pod, and since
  # the envsubst initContainer renders alertmanager.yml only at container START,
  # the OLD config keeps running silently (found 2026-07-30: an added inhibit_rule
  # applied cleanly per Ansible, yet the live pod ran without it for good).
  register: alertmanager_config

- name: Create gotify-bridge-script ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gotify-bridge-script
        namespace: monitoring
      data:
        bridge.py: "{{ lookup('file', 'alertmgr_gotify_bridge.py') }}"

- name: Create alertmanager-gotify-bridge Deployment
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: alertmanager-gotify-bridge
        namespace: monitoring
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: alertmanager-gotify-bridge
        template:
          metadata:
            labels:
              app: alertmanager-gotify-bridge
            annotations:
              keel.sh/policy: force
              keel.sh/match-tag: "true"
              keel.sh/pollSchedule: "@every 24h"
              keel.sh/trigger: poll
          spec:
            nodeSelector:
              kubernetes.io/arch: amd64
            containers:
              - name: bridge
                image: python:3.14-slim-trixie
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    apt update && apt -y install tini procps && \
                    pip install --no-cache-dir requests && \
                    touch /tmp/startup-complete && \
                    exec tini -- python /app/bridge.py
                ports:
                  - containerPort: 8080
                    name: http
                startupProbe:
                  exec:
                    command: ["test", "-f", "/tmp/startup-complete"]
                  failureThreshold: 30
                  periodSeconds: 2
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: http
                  periodSeconds: 10
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: http
                  periodSeconds: 5
                env:
                  - name: TINI_SUBREAPER
                    value: "1"
                envFrom:
                  - secretRef:
                      name: alertmanager-secrets
                volumeMounts:
                  - name: script
                    mountPath: /app
                resources:
                  requests:
                    cpu: 15m
                    memory: 50Mi
                  limits:
                    cpu: 1500m
                    memory: 450Mi
            volumes:
            - name: script
              configMap:
                name: gotify-bridge-script
                defaultMode: 0755

- name: Create alertmanager-gotify-bridge Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: alertmanager-gotify-bridge
        namespace: monitoring
      spec:
        selector:
          app: alertmanager-gotify-bridge
        ports:
        - port: 8080
          targetPort: http

- name: Create alertmanager Deployment
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: alertmanager
        namespace: monitoring
      spec:
        replicas: 1
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app: alertmanager
        template:
          metadata:
            labels:
              app: alertmanager
            annotations:
              # Rolls the pod on any alertmanager.yml change (same pattern as the
              # prometheus Deployment). Covers the ConfigMap ONLY: a change to
              # alertmanager-secrets (the ${VAR} values envsubst inlines) still
              # needs a manual `kubectl rollout restart deploy/alertmanager`.
              checksum/config: "{{ alertmanager_config.result.data | to_json | hash('sha256') }}"
              kubectl.kubernetes.io/default-container: "alertmanager"
              keel.sh/policy: patch
              keel.sh/match-tag: "true"
              keel.sh/pollSchedule: "@every 24h"
              keel.sh/trigger: poll
          spec:
            nodeSelector:
              kubernetes.io/arch: amd64
            initContainers:
            - name: envsubst-config
              image: alpine:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  apk add --no-cache gettext && \
                  export SMTP_SMARTHOST="${HOST_IP}:25" && \
                  envsubst < /config-template/alertmanager.yml > /etc/alertmanager/alertmanager.yml
              env:
              - name: HOST_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              envFrom:
              - secretRef:
                  name: alertmanager-secrets
              volumeMounts:
              - name: config-template
                mountPath: /config-template
              - name: config-processed
                mountPath: /etc/alertmanager
            containers:
            - name: alertmanager
              image: prom/alertmanager:v0.34.0
              args:
                - "--config.file=/etc/alertmanager/alertmanager.yml"
                - "--storage.path=/alertmanager"
                - "--log.level=debug"
              ports:
              - name: alertmgrport
                containerPort: 9093
              volumeMounts:
              - name: config-processed
                mountPath: /etc/alertmanager
              - name: storage-volume
                mountPath: /alertmanager
              resources:
                requests:
                  cpu: 50m
                  memory: 50Mi
                limits:
                  cpu: 200m
                  memory: 100Mi
            volumes:
            - name: config-template
              configMap:
                name: alertmanager-config
            - name: config-processed
              emptyDir: {}
            - name: storage-volume
              hostPath:
                path: /var/lib/k8s-data/alertmanager
                type: DirectoryOrCreate

- name: Create alertmanager Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: alertmanager
        namespace: monitoring
      spec:
        selector:
          app: alertmanager
        ports:
        - port: 9093
          targetPort: alertmgrport
