---
# Skills je Hermes-Nutzer als ConfigMap je Skill (hermes-skill-<slug>); die Pods kopieren sie per initContainer nach $HERMES_HOME.
- name: Reset hermes skill facts
  ansible.builtin.set_fact:
    _hermes_skills_by_user: {}
    _hermes_skill_catalog: {}
    _hermes_skill_users: "{{ _hermes_active_users | selectattr('skills_enabled', 'defined') | selectattr('skills_enabled', 'true') | list }}"

- name: Resolve hermes skills for skills-enabled users
  when: _hermes_skill_users | length > 0
  block:
    - name: Assert hermes skill source variables
      ansible.builtin.assert:
        that:
          - hermes_skill_dirs is sequence
          - hermes_skill_dirs is not string
          - (hermes_skill_roles_file | default('') | length > 0) or (_hermes_skill_users | selectattr('skills_role', 'defined') | selectattr('skills_role', 'ne', '') | list | length == 0)
        fail_msg: "hermes_skill_dirs must be a list; hermes_skill_roles_file is required when a user sets skills_role"

    - name: Load hermes skill role mapping
      ansible.builtin.set_fact:
        _hermes_skill_roles: "{{ (lookup('file', hermes_skill_roles_file | expanduser) | from_yaml).roles | default({}) if hermes_skill_roles_file | length > 0 else {} }}"
        _hermes_skill_roles_dir: "{{ (hermes_skill_roles_file | expanduser | dirname) if hermes_skill_roles_file | length > 0 else '' }}"

    - name: Assert hermes skill roles are known
      ansible.builtin.assert:
        that: item.skills_role in _hermes_skill_roles
        fail_msg: "Unknown skills_role '{{ item.skills_role }}' for hermes user {{ item.username }}; known: {{ _hermes_skill_roles.keys() | list }}"
      loop: "{{ _hermes_skill_users | selectattr('skills_role', 'defined') | selectattr('skills_role', 'ne', '') | list }}"
      loop_control:
        label: "{{ item.username }}"

    - name: Collect skill directories per hermes user
      ansible.builtin.set_fact:
        _hermes_skill_dirs_by_user: "{{ _hermes_skill_dirs_by_user | default({}) | combine({item.username: ((hermes_skill_dirs | map('expanduser') | list) + ((_hermes_skill_roles[item.skills_role] | map('regex_replace', '^', _hermes_skill_roles_dir ~ '/') | list) if item.skills_role | default('') | length > 0 else [])) | map('realpath') | unique | list}) }}"
      loop: "{{ _hermes_skill_users }}"
      loop_control:
        label: "{{ item.username }}"

    - name: Derive the distinct skill directory list
      ansible.builtin.set_fact:
        _hermes_skill_all_dirs: "{{ _hermes_skill_dirs_by_user.values() | flatten | unique | sort }}"

    - name: Assert hermes skill slugs are valid and unique
      ansible.builtin.assert:
        that:
          - _hermes_skill_all_dirs | map('basename') | unique | length == _hermes_skill_all_dirs | length
          - _hermes_skill_all_dirs | map('basename') | map('regex_search', '^[a-z0-9]([-a-z0-9]{0,46}[a-z0-9])?$') | select('none') | list | length == 0
        fail_msg: "Skill directory basenames must be unique DNS labels (max 48 chars): {{ _hermes_skill_all_dirs }}"

    - name: Find hermes skill files
      ansible.builtin.find:
        paths: "{{ item }}"
        recurse: true
        file_type: file
      loop: "{{ _hermes_skill_all_dirs }}"
      register: _hermes_skill_find
      delegate_to: localhost
      become: false
      check_mode: false

    - name: Assert every hermes skill directory has a SKILL.md
      ansible.builtin.assert:
        that: (item.item ~ '/SKILL.md') in (item.files | map(attribute='path') | list)
        fail_msg: "{{ item.item }} contains no SKILL.md"
      loop: "{{ _hermes_skill_find.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Build hermes skill catalog
      ansible.builtin.set_fact:
        _hermes_skill_catalog: "{{ _hermes_skill_catalog | combine({item.item | basename: {'dir': item.item, 'files': item.files | map(attribute='path') | map('relpath', item.item) | sort | list}}) }}"
      loop: "{{ _hermes_skill_find.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Render and size-check hermes skill ConfigMaps
      ansible.builtin.set_fact:
        _hermes_skill_hash: "{{ _hermes_skill_hash | default({}) | combine({item.key: _cm_text | hash('sha256')}) }}"
      vars:
        _cm_text: "{{ lookup('template', 'hermes/hermes_skill_configmap.yaml.j2') }}"
      loop: "{{ _hermes_skill_catalog | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Assert hermes skill ConfigMaps stay below the apply annotation limit
      ansible.builtin.assert:
        that: (lookup('template', 'hermes/hermes_skill_configmap.yaml.j2') | length) < 200000
        fail_msg: "Skill {{ item.key }} exceeds 200 kB; split it or trim reference files"
      loop: "{{ _hermes_skill_catalog | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Apply hermes skill ConfigMaps
      kubernetes.core.k8s:
        state: present
        apply: true
        definition: "{{ lookup('template', 'hermes/hermes_skill_configmap.yaml.j2') | from_yaml }}"
      loop: "{{ _hermes_skill_catalog | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Compute hermes skill set per user
      ansible.builtin.set_fact:
        _hermes_skills_by_user: "{{ _hermes_skills_by_user | combine({item.username: {'slugs': _slugs, 'hash': (_slugs | map('extract', _hermes_skill_hash) | join(',') ~ ':' ~ _slugs | join(',')) | hash('sha256')}}) }}"
      vars:
        _slugs: "{{ _hermes_skill_dirs_by_user[item.username] | map('basename') | sort | list }}"
      loop: "{{ _hermes_skill_users }}"
      loop_control:
        label: "{{ item.username }}"

- name: List hermes skill ConfigMaps
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: "{{ hermes.namespace }}"
    label_selectors:
      - hermes-component=skill
  register: _hermes_skill_cms

- name: Remove hermes skill ConfigMaps no user needs any more
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    namespace: "{{ hermes.namespace }}"
    name: "{{ item }}"
  loop: "{{ _hermes_skill_cms.resources | map(attribute='metadata.name') | difference(_hermes_skill_catalog.keys() | map('regex_replace', '^', 'hermes-skill-') | list) }}"
