---
# Outline wiki: single pinned Deployment on k3smaster, DB on the shared PostgreSQL, shared Redis,
# attachments on hostPath, magic-link login via the node postfix, first admin bootstrapped here.
# Knobs: defaults/main/outline.yml.

- name: Outline — install
  when:
    - outline_enabled | default(false) | bool
    - not (outline_teardown | default(false) | bool)
  block:
    - name: Assert Outline secrets are real
      ansible.builtin.assert:
        that:
          - outline_secret_key is match('^[0-9a-f]{64}$')
          - outline_utils_secret | length >= 32
          - postgresql_outline_password | length >= 16
          - outline_admin.email != 'admin@example.com'
          - outline_admin.api_key is match('^ol_api_\\w{38}$')
          - outline_users | map(attribute='role') | difference(['admin', 'member', 'viewer']) | length == 0
          - outline_users | map(attribute='email') | map('lower') | unique | length == outline_users | length
          - outline_admin.email | lower not in (outline_users | map(attribute='email') | map('lower'))
          - ([outline_admin] + outline_users) | selectattr('hermes_user', 'defined') | map(attribute='hermes_user') | unique | length
            == ([outline_admin] + outline_users) | selectattr('hermes_user', 'defined') | length
          - >-
            ([outline_admin] + outline_users) | selectattr('hermes_user', 'defined') | map(attribute='hermes_user')
            | difference((hermes_users | default([]) | hermes_resolve_email(hermes_mail_settings)) | map(attribute='username')) | length == 0
          - >-
            outline_users | map(attribute='email') | map('lower')
            | intersect((hermes_users | default([]) | hermes_resolve_email(hermes_mail_settings)) | selectattr('enabled') | selectattr('outline', 'defined')
                        | map(attribute='email') | map(attribute='address') | map('lower'))
            | length == 0
        fail_msg: "Outline vars invalid: dummies in outline_secret_key / outline_utils_secret / postgresql_outline_password / outline_admin, or bad outline_users (role, duplicate email, hermes_user duplicate or unknown); set them in group_vars/all/vault/"
        quiet: true

    - name: Create outline namespace
      kubernetes.core.k8s:
        name: "{{ outline_namespace }}"
        api_version: v1
        kind: Namespace
        state: present

    - name: Get PostgreSQL pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: postgresql
        label_selectors:
          - app=postgresql
        field_selectors:
          - status.phase=Running
      register: outline_postgresql_pods

    - name: Set PostgreSQL pod name fact
      ansible.builtin.set_fact:
        outline_postgresql_pod_name: "{{ (outline_postgresql_pods.resources | rejectattr('metadata.deletionTimestamp', 'defined') | first).metadata.name }}"

    # k8s_exec runs for real under --check.
    - name: Ensure outline user and database exist in PostgreSQL
      when: not ansible_check_mode
      kubernetes.core.k8s_exec:
        namespace: postgresql
        pod: "{{ outline_postgresql_pod_name }}"
        command: |
          bash -c '
            set -e
            OUTLINE_PASSWORD="{{ postgresql_outline_password }}"

            if psql -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='\''outline'\''" | grep -q 1; then
              psql -U postgres -c "ALTER USER outline WITH PASSWORD '\''${OUTLINE_PASSWORD}'\'';"
              echo "User outline: exists (password ensured)"
            else
              psql -U postgres -c "CREATE USER outline WITH PASSWORD '\''${OUTLINE_PASSWORD}'\'';"
              echo "User outline: created"
            fi

            if psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='\''outline'\''" | grep -q 1; then
              echo "Database outline: exists"
            else
              psql -U postgres -c "CREATE DATABASE outline OWNER outline;"
              psql -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE outline TO outline;"
              echo "Database outline: created"
            fi
          '
      register: outline_db_ensure
      changed_when: "'created' in outline_db_ensure.stdout"
      no_log: true

    - name: Create outline egress NetworkPolicy
      when: outline_network_policies_enabled | bool
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: outline-egress
            namespace: "{{ outline_namespace }}"
          spec:
            podSelector:
              matchLabels:
                app: outline
            policyTypes:
              - Egress
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                    podSelector:
                      matchLabels:
                        k8s-app: kube-dns
                ports:
                  - protocol: UDP
                    port: 53
                  - protocol: TCP
                    port: 53
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: postgresql
                ports:
                  - protocol: TCP
                    port: "{{ outline_db_port }}"
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: redis
                ports:
                  - protocol: TCP
                    port: 6379
              # Internet (link unfurls) + node postfix, but no other in-cluster pods.
              - to:
                  - ipBlock:
                      cidr: 0.0.0.0/0
                      except:
                        - "{{ cluster_cidr }}"
                        - "{{ service_cidr }}"

    - name: Create outline ingress NetworkPolicy (Traefik only)
      when: outline_network_policies_enabled | bool
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: outline-ingress
            namespace: "{{ outline_namespace }}"
          spec:
            podSelector:
              matchLabels:
                app: outline
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: "{{ traefik.namespace }}"
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/name: traefik

    - name: Create outline env secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: outline-env
            namespace: "{{ outline_namespace }}"
          type: Opaque
          stringData:
            SECRET_KEY: "{{ outline_secret_key }}"
            UTILS_SECRET: "{{ outline_utils_secret }}"
            DATABASE_URL: "postgres://outline:{{ postgresql_outline_password | urlencode }}@{{ outline_db_host }}:{{ outline_db_port }}/outline"
      no_log: true

    - name: Create outline service
      kubernetes.core.k8s:
        state: present
        definition:
          kind: Service
          apiVersion: v1
          metadata:
            name: outline
            namespace: "{{ outline_namespace }}"
            labels:
              app: outline
          spec:
            selector:
              app: outline
            ports:
              - port: "{{ outline_port }}"
                name: http
                targetPort: "{{ outline_port }}"
                protocol: TCP

    - name: Create outline deployment
      kubernetes.core.k8s:
        state: present
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 600
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: outline
            namespace: "{{ outline_namespace }}"
            labels:
              app: outline
            annotations:
              keel.sh/policy: force
              keel.sh/match-tag: "true"
              keel.sh/pollSchedule: "@every 24h"
              keel.sh/trigger: poll
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: outline
            template:
              metadata:
                labels:
                  app: outline
                annotations:
                  checksum/secrets: "{{ (outline_secret_key ~ outline_utils_secret ~ postgresql_outline_password) | hash('sha256') }}"
              spec:
                nodeSelector:
                  node-role: k3smaster
                dnsConfig:
                  options:
                    - name: ndots
                      value: "1"
                securityContext:
                  runAsUser: 1001
                  runAsGroup: 1001
                  runAsNonRoot: true
                initContainers:
                  # fsGroup does not apply to hostPath.
                  - name: fix-perms
                    image: "{{ outline_busybox_image }}"
                    imagePullPolicy: IfNotPresent
                    securityContext:
                      runAsUser: 0
                      runAsNonRoot: false
                    command: ["sh", "-c", "chown 1001:1001 /data && chmod 0750 /data"]
                    volumeMounts:
                      - name: data
                        mountPath: /data
                containers:
                  - name: outline
                    image: "{{ outline_image }}"
                    imagePullPolicy: IfNotPresent
                    ports:
                      - containerPort: "{{ outline_port }}"
                        name: http
                        protocol: TCP
                    env:
                      # Must stay before SMTP_HOST: $(NODE_IP) only expands previously defined vars.
                      - name: NODE_IP
                        valueFrom:
                          fieldRef:
                            fieldPath: status.hostIP
                      - name: NODE_ENV
                        value: production
                      - name: URL
                        value: "https://{{ outline_hostname }}"
                      - name: PORT
                        value: "{{ outline_port | string }}"
                      - name: WEB_CONCURRENCY
                        value: "1"
                      - name: DEFAULT_LANGUAGE
                        value: "{{ outline_default_language }}"
                      - name: PGSSLMODE
                        value: disable
                      - name: REDIS_URL
                        value: "{{ outline_redis_url }}"
                      - name: FILE_STORAGE
                        value: local
                      - name: FILE_STORAGE_LOCAL_ROOT_DIR
                        value: /var/lib/outline/data
                      - name: FORCE_HTTPS
                        value: "true"
                      - name: ENABLE_UPDATES
                        value: "false"
                      - name: SMTP_HOST
                        value: "{{ outline_smtp_host }}"
                      - name: SMTP_PORT
                        value: "{{ outline_smtp_port | string }}"
                      # false = STARTTLS (rejectUnauthorized off), true would mean implicit TLS on 465.
                      - name: SMTP_SECURE
                        value: "false"
                      - name: SMTP_FROM_EMAIL
                        value: "{{ outline_smtp_from }}"
                      - name: LOG_LEVEL
                        value: info
                    envFrom:
                      - secretRef:
                          name: outline-env
                    resources:
                      requests:
                        cpu: 100m
                        memory: 512Mi
                      limits:
                        cpu: "2"
                        memory: 2Gi
                    # First boot runs all migrations before the port opens.
                    startupProbe:
                      httpGet:
                        path: /_health
                        port: http
                      periodSeconds: 10
                      failureThreshold: 60
                    readinessProbe:
                      httpGet:
                        path: /_health
                        port: http
                      periodSeconds: 15
                    livenessProbe:
                      httpGet:
                        path: /_health
                        port: http
                      periodSeconds: 30
                      failureThreshold: 5
                    volumeMounts:
                      - name: data
                        mountPath: /var/lib/outline/data
                restartPolicy: Always
                volumes:
                  - name: data
                    hostPath:
                      path: "{{ outline_data_base }}"
                      type: DirectoryOrCreate

    - name: Count Outline teams
      when: not ansible_check_mode
      kubernetes.core.k8s_exec:
        namespace: postgresql
        pod: "{{ outline_postgresql_pod_name }}"
        command: psql -U postgres -d outline -tAc "SELECT count(*) FROM teams"
      register: outline_team_count
      changed_when: false

    - name: Get Outline pod
      when: not ansible_check_mode
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ outline_namespace }}"
        label_selectors:
          - app=outline
        field_selectors:
          - status.phase=Running
      register: outline_pods

    # The response redirects to a one-time sign-in URL, so it is not followed or printed.
    - name: Create Outline workspace and first admin (installation.create)
      when:
        - not ansible_check_mode
        - outline_team_count.stdout | trim | int == 0
      kubernetes.core.k8s_exec:
        namespace: "{{ outline_namespace }}"
        pod: "{{ outline_pods.resources[0].metadata.name }}"
        container: outline
        command: >-
          node -e {{ _outline_install_js | quote }}
          {{ {'teamName': outline_team_name, 'userName': outline_admin.name, 'userEmail': outline_admin.email} | to_json | quote }}
      vars:
        _outline_install_js: >-
          fetch('http://127.0.0.1:{{ outline_port }}/api/installation.create', {method: 'POST', redirect: 'manual',
          headers: {'Content-Type': 'application/json', 'X-Forwarded-Proto': 'https'}, body: process.argv[1]})
          .then(r => { console.log('HTTP ' + r.status); process.exit(r.status < 400 ? 0 : 1); })
          .catch(e => { console.error(e.message); process.exit(1); })
      register: outline_install

    # Outline can only mint keys for the calling user, so vault-held keys are stored the way Outline does (sha256 hash).
    - name: Create outline ip-allowlist middleware
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: outline-ip-allowlist
            namespace: "{{ outline_namespace }}"
          spec:
            ipAllowList:
              sourceRange: "{{ traefik_public_allowlist if (app_exposure.outline | default(app_exposure_default)) == 'public' else traefik_internal_allowlist }}"

    - name: Create outline http to https redirect middleware
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: redirect-myhttps
            namespace: "{{ outline_namespace }}"
          spec:
            redirectScheme:
              scheme: https

    - name: Create outline TLS certificate
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: "{{ outline_hostname }}"
            namespace: "{{ outline_namespace }}"
          spec:
            dnsNames:
              - "{{ outline_hostname }}"
            secretName: "{{ outline_hostname }}"
            issuerRef:
              name: "{{ outline_tls_issuer }}"
              kind: ClusterIssuer

    - name: Create outline http ingressroute with redirect
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: outline-ingress
            namespace: "{{ outline_namespace }}"
          spec:
            entryPoints:
              - web
            routes:
              - kind: Rule
                match: "Host(`{{ outline_hostname }}`)"
                priority: 10
                services:
                  - kind: Service
                    name: outline
                    namespace: "{{ outline_namespace }}"
                    passHostHeader: true
                    port: "{{ outline_port }}"
                middlewares:
                  - name: redirect-myhttps
                  - name: outline-ip-allowlist

    - name: Create outline https ingressroute
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: outline-https-ingress
            namespace: "{{ outline_namespace }}"
          spec:
            entryPoints:
              - websecure
            routes:
              - kind: Rule
                match: "Host(`{{ outline_hostname }}`)"
                priority: 10
                middlewares:
                  - name: outline-ip-allowlist
                services:
                  - kind: Service
                    name: outline
                    namespace: "{{ outline_namespace }}"
                    passHostHeader: true
                    port: "{{ outline_port }}"
            tls:
              secretName: "{{ outline_hostname }}"

    - name: Register DNS A record for outline
      community.general.nsupdate:
        record: "{{ outline_hostname }}."
        type: A
        value: "{{ nsupdate_default.ingress_ip }}"
        state: present

    - name: Wait for Outline to answer on its public URL (cert + DNS) before using the API
      when: not ansible_check_mode
      ansible.builtin.uri:
        url: "https://{{ outline_hostname }}/_health"
        status_code: 200
      register: _outline_ready
      until: _outline_ready.status == 200
      retries: 60
      delay: 10

    - name: Seed Outline API key list with the admin key
      ansible.builtin.set_fact:
        _outline_api_keys:
          - {label: admin, email: "{{ outline_admin.email }}", key_name: ansible, value: "{{ outline_admin.api_key }}"}
        _outline_invites: []
        _outline_groups: []
        _outline_agent_emails: []
        # Args: email, key name, sha256 hex, last4. Rotation deletes the user's other keys of that name.
        _outline_key_sql: |
          set -e
          psql -U postgres -d outline -v ON_ERROR_STOP=1 -tA -v email="$1" -v keyname="$2" -v keyhash="$3" -v last4="$4" <<'SQL'
          SELECT 'USERS ' || count(*) FROM users WHERE lower(email) = lower(:'email') AND "deletedAt" IS NULL;
          DELETE FROM "apiKeys" WHERE name = :'keyname'
            AND "userId" IN (SELECT id FROM users WHERE lower(email) = lower(:'email') AND "deletedAt" IS NULL)
            AND (hash IS DISTINCT FROM :'keyhash' OR "deletedAt" IS NOT NULL);
          INSERT INTO "apiKeys" (id, name, hash, last4, "userId", "createdAt", "updatedAt")
            SELECT gen_random_uuid(), :'keyname', :'keyhash', :'last4', id, now(), now()
            FROM users WHERE lower(email) = lower(:'email') AND "deletedAt" IS NULL
            ON CONFLICT (hash) DO NOTHING;
          SQL
      no_log: true

    - name: Add hermes agents to the Outline API key list
      ansible.builtin.set_fact:
        _outline_api_keys: >-
          {{ _outline_api_keys + [{'label': item.username, 'email': item.email.address, 'key_name': 'hermes', 'value': item.outline.api_key}] }}
        _outline_invites: "{{ _outline_invites + [{'email': item.email.address, 'name': item.username ~ ' (Hermes)', 'role': 'member'}] }}"
        _outline_agent_emails: "{{ _outline_agent_emails + [item.email.address] }}"
        _outline_groups: >-
          {{ _outline_groups + [{'name': item.username, 'description': item.username ~ ': human + Hermes agent',
                                 'emails': [_outline_human_email, item.email.address]}] }}
      vars:
        # The human is the single outline_admin/outline_users entry with hermes_user == username; '' fails the assert below.
        _outline_human_email: >-
          {{ ([outline_admin] + outline_users) | selectattr('hermes_user', 'defined') | selectattr('hermes_user', 'eq', item.username)
             | map(attribute='email') | first | default('') }}
      loop: "{{ (hermes_users | default([]) | hermes_resolve_email(hermes_mail_settings)) | selectattr('enabled') | selectattr('outline', 'defined') | list }}"
      loop_control:
        label: "{{ item.username }}"
      no_log: true

    - name: Assert every hermes agent is linked to a human (hermes_user)
      ansible.builtin.assert:
        that:
          - item.emails[0] | length > 0
        fail_msg: "hermes user {{ item.name }} has an Outline agent but no human: set hermes_user: {{ item.name }} on outline_admin or one outline_users entry"
        quiet: true
      loop: "{{ _outline_groups }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure admin API key exists in Outline
      when: not ansible_check_mode
      kubernetes.core.k8s_exec:
        namespace: postgresql
        pod: "{{ outline_postgresql_pod_name }}"
        command: >-
          bash -c {{ _outline_key_sql | quote }} _
          {{ _outline_api_keys[0].email | quote }} {{ _outline_api_keys[0].key_name | quote }}
          {{ _outline_api_keys[0].value | hash('sha256') }} {{ _outline_api_keys[0].value[-4:] | quote }}
      register: outline_admin_key
      changed_when: outline_admin_key.stdout is search('^(DELETE [1-9]|INSERT 0 [1-9])', multiline=True)
      failed_when: outline_admin_key.rc != 0 or outline_admin_key.stdout is not search('^USERS 1$', multiline=True)
      no_log: true

    # Existing users are skipped; removal from the lists never deletes or suspends anyone.
    - name: Invite Outline users (users.invite; hermes agents silently, humans with invite mail)
      when:
        - not ansible_check_mode
        - item.invites | length > 0
      ansible.builtin.uri:
        url: "https://{{ outline_hostname }}/api/users.invite"
        method: POST
        headers:
          Authorization: "Bearer {{ outline_admin.api_key }}"
        body_format: json
        body:
          suppressEmail: "{{ item.suppress_email }}"
          invites: "{{ item.invites }}"
      loop:
        - {label: hermes agents, suppress_email: true, invites: "{{ _outline_invites }}"}
        - label: outline_users
          suppress_email: false
          invites: "{{ outline_users | map('dict2items') | map('selectattr', 'key', 'in', ['email', 'name', 'role']) | map('items2dict') | list }}"
      loop_control:
        label: "{{ item.label }}"
      register: outline_invite
      changed_when: outline_invite.json.data.users | length > 0
      no_log: true

    - name: Ensure per-agent Outline API keys exist (hermes_users[*].outline.api_key)
      when: not ansible_check_mode
      kubernetes.core.k8s_exec:
        namespace: postgresql
        pod: "{{ outline_postgresql_pod_name }}"
        command: >-
          bash -c {{ _outline_key_sql | quote }} _
          {{ item.email | quote }} {{ item.key_name | quote }}
          {{ item.value | hash('sha256') }} {{ item.value[-4:] | quote }}
      loop: "{{ _outline_api_keys[1:] }}"
      loop_control:
        label: "{{ item.label }}"
      register: outline_agent_keys
      changed_when: outline_agent_keys.stdout is search('^(DELETE [1-9]|INSERT 0 [1-9])', multiline=True)
      failed_when: outline_agent_keys.rc != 0 or outline_agent_keys.stdout is not search('^USERS 1$', multiline=True)
      no_log: true

    # Additive group sync: missing groups are created and missing members added, nothing is ever removed.
    - name: Set Outline group list (shared agent group + one human/agent pair group per hermes user)
      ansible.builtin.set_fact:
        _outline_all_groups: >-
          {{ ([{'name': outline_hermes_agents_group, 'description': 'All Hermes agent accounts', 'emails': _outline_agent_emails}]
              + _outline_groups) | selectattr('emails') | list }}

    - name: Look up Outline user ids for group members
      when: not ansible_check_mode
      ansible.builtin.uri:
        url: "https://{{ outline_hostname }}/api/users.list"
        method: POST
        headers:
          Authorization: "Bearer {{ outline_admin.api_key }}"
        body_format: json
        body: {emails: ["{{ item }}"], limit: 1}
      loop: "{{ _outline_all_groups | map(attribute='emails') | flatten | map('lower') | unique }}"
      register: outline_user_lookup
      failed_when: outline_user_lookup.status != 200 or outline_user_lookup.json.data | length != 1
      no_log: true

    - name: Look up existing Outline groups
      when: not ansible_check_mode
      ansible.builtin.uri:
        url: "https://{{ outline_hostname }}/api/groups.list"
        method: POST
        headers:
          Authorization: "Bearer {{ outline_admin.api_key }}"
        body_format: json
        body: {name: "{{ item.name }}", limit: 1}
      loop: "{{ _outline_all_groups }}"
      loop_control:
        label: "{{ item.name }}"
      register: outline_group_lookup
      no_log: true

    - name: Create missing Outline groups
      when:
        - not ansible_check_mode
        - item.json.data.groups | length == 0
      ansible.builtin.uri:
        url: "https://{{ outline_hostname }}/api/groups.create"
        method: POST
        headers:
          Authorization: "Bearer {{ outline_admin.api_key }}"
        body_format: json
        body: {name: "{{ item.item.name }}", description: "{{ item.item.description }}"}
      loop: "{{ outline_group_lookup.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      register: outline_group_create
      changed_when: true
      no_log: true

    - name: Map Outline group names to ids
      when: not ansible_check_mode
      ansible.builtin.set_fact:
        _outline_group_ids: >-
          {{ _outline_group_ids | default({}) | combine({item.item.name: (item.json.data.groups[0].id if item.json.data.groups
             else (outline_group_create.results | selectattr('item.item.name', 'eq', item.item.name) | first).json.data.id)}) }}
      loop: "{{ outline_group_lookup.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Read Outline group memberships
      when: not ansible_check_mode
      ansible.builtin.uri:
        url: "https://{{ outline_hostname }}/api/groups.memberships"
        method: POST
        headers:
          Authorization: "Bearer {{ outline_admin.api_key }}"
        body_format: json
        body: {id: "{{ _outline_group_ids[item.name] }}", limit: 100}
      loop: "{{ _outline_all_groups }}"
      loop_control:
        label: "{{ item.name }}"
      register: outline_group_members
      no_log: true

    - name: Add missing members to Outline groups
      when:
        - not ansible_check_mode
        - _user_id not in (outline_group_members.results | selectattr('item.name', 'eq', item.0.name) | first).json.data.users | map(attribute='id')
      ansible.builtin.uri:
        url: "https://{{ outline_hostname }}/api/groups.add_user"
        method: POST
        headers:
          Authorization: "Bearer {{ outline_admin.api_key }}"
        body_format: json
        body: {id: "{{ _outline_group_ids[item.0.name] }}", userId: "{{ _user_id }}"}
      vars:
        _user_id: "{{ (outline_user_lookup.results | selectattr('item', 'eq', item.1 | lower) | first).json.data[0].id }}"
      loop: "{{ _outline_all_groups | subelements('emails') }}"
      loop_control:
        label: "{{ item.0.name }} <- {{ item.1 }}"
      changed_when: true
      no_log: true

- name: Outline — teardown (opt-in `-e outline_teardown=true`)
  when: outline_teardown | default(false) | bool
  block:
    # The outline DB and outline_data_base are kept; drop them by hand to abandon.
    - name: Delete outline namespace (cascades all outline resources)
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: "{{ outline_namespace }}"

    - name: Remove DNS A record for outline
      community.general.nsupdate:
        record: "{{ outline_hostname }}."
        type: A
        state: absent
