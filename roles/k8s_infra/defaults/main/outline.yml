---
# === Outline (team wiki / knowledge base) ===
# Deployed by roles/k8s_infra/tasks/apps/outline.yml (tag: outline).
# false only skips the install; removal is the opt-in `-e outline_teardown=true` (DB + attachments are kept).
outline_enabled: false
outline_teardown: false
outline_namespace: "outline"
# Pinned: startup auto-migrates the schema, so bumps are deliberate.
outline_image: "outlinewiki/outline:1.12.0"
outline_busybox_image: "busybox:1.38"
outline_port: 3000
outline_hostname: "outline.{{ dns_external_domain_suffix }}"
outline_tls_issuer: "letsencrypt-production"
# Attachments (FILE_STORAGE=local); the image runs as uid/gid 1001.
outline_data_base: "/mnt/nfs/outline-data"
outline_default_language: "de_DE"
outline_network_policies_enabled: true

outline_db_host: "postgresql.postgresql.svc.cluster.local"
outline_db_port: 5432
# Shared Redis, own DB index (searxng uses 3).
outline_redis_url: "redis://redis.redis.svc.cluster.local:6379/4"

# Magic-link login; $(NODE_IP) = the pod's own node postfix (STARTTLS, cert not verified by Outline).
outline_smtp_host: "$(NODE_IP)"
outline_smtp_port: 25
outline_smtp_from: "Outline <outline@{{ dns_external_domain_suffix }}>"

# Workspace + first admin, created once via api/installation.create when the DB has no team yet.
outline_team_name: "dgxarley"

# Sensitive, real values in group_vars/all/vault/outline.sops.yml.
# SECRET_KEY must be exactly 64 hex chars (openssl rand -hex 32); rotating it invalidates all sessions.
outline_secret_key: "changeme"
outline_utils_secret: "changeme"
outline_admin:
  name: "Admin"
  email: "admin@example.com"
  # Ansible-managed admin key (users.invite); vault-held, stored hashed in Outline.
  api_key: "ol_api_changeme"

# ALL humans incl. those with a hermes agent (agents get separate '<user> (Hermes)' accounts); invited with mail, removal deletes nothing.
# Entries: {name, email, role: admin|member|viewer, hermes_user?}; hermes_user (also allowed on outline_admin) is the ONLY human<->agent link.
outline_users: []

# Holds every hermes agent account; each hermes user also gets a group <username> with human + agent (additive sync).
outline_hermes_agents_group: "Hermes Agents"
