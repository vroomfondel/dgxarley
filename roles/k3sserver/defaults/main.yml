---
# defaults file for k3sserver
# ~ $ curl -s https://api.github.com/repos/k3s-io/k3s/releases | jq -r '.[0].tag_name'
# curl -s https://update.k3s.io/v1-release/channels | jq -r '.data[] | select(.id|IN("stable","latest")) | "\(.id)\t\(.latest)"'
# v1.36.2+k3s1

k3s_version: "v1.36.3+k3s1"

k3s_node_ip: "{{ ansible_facts.default_ipv4.address }}"

# false = kube-router NetworkPolicy controller runs (NetworkPolicies are enforced).
# Changing this requires a restart of ALL nodes (k3s + k3s-agent).
k3s_disable_network_policy: false

kubeconfig_context_name: "admin@cluster"

# Kubelet image garbage collection
kubelet_image_gc_high_threshold: 95
kubelet_image_gc_low_threshold: 90
kubelet_image_minimum_gc_age: "24h"

# Kubelet eviction thresholds — *.available lowered from the upstream defaults
# (nodefs<10%, imagefs<15%) to 2% so a buildah/HF-cache/weight spike on a spark
# (1.8T disk, only ~15% free) no longer trips a DiskPressure taint + pod eviction.
# inodesFree kept at the 5% upstream default. Restore defaults by reverting to:
# "memory.available<100Mi,nodefs.available<10%,nodefs.inodesFree<5%,imagefs.available<15%,imagefs.inodesFree<5%"
kubelet_eviction_hard: "memory.available<100Mi,nodefs.available<2%,nodefs.inodesFree<5%,imagefs.available<2%,imagefs.inodesFree<5%"
kubelet_eviction_pressure_transition_period: "5m"

# Node swap (KEP-2400, GA since k8s 1.30 — we run 1.36). OFF by default; enable
# per group (e.g. group_vars/dgxsparks) so a node can use a disk-backed swapfile
# to absorb the transient weight-load peak of borderline models (DeepSeek-V4-
# Flash-FP8 on 4×GB10). Requires a swap device on the node AND a k3s restart to
# take effect; just rendering config.yaml does NOT restart k3s.
#  - failSwapOn:false   → kubelet would otherwise refuse to start with swap on.
#  - swapBehavior:LimitedSwap → only valid GA value besides NoSwap (UnlimitedSwap
#    was removed). Grants swap ONLY to Burstable pods, capped at
#    (container memory.request / node total) × total swap. BestEffort/Guaranteed
#    get zero — the consumer pod must set a memory request (see sglang_shard).
# Both fields are set via a KubeletConfiguration file (swapBehavior has no flag),
# referenced from kubelet-arg `config=`.
k3s_node_swap_enabled: false
k3s_node_swap_behavior: "LimitedSwap"
k3s_kubelet_config_path: "/etc/rancher/k3s/kubelet-config.yaml"

# HAProxy stats password (overridden by vault)
haproxy_stats_password: "changeme"

# sops + age — secret encryption tooling installed on all k3sservers (tag: sops_age).
# Both are single Go binaries pulled from upstream GitHub releases (no apt package
# for sops; the distro `age` package lags), arch-aware (amd64 on k3smaster, arm64
# on the sparks). Versions pinned here; bump after checking the latest release:
#   sops: curl -s https://api.github.com/repos/getsops/sops/releases/latest | jq -r '.tag_name'
#   age:  curl -s https://api.github.com/repos/FiloSottile/age/releases/latest | jq -r '.tag_name'
sops_version: "3.13.2"
age_version: "1.3.1"

# rustfs-cli ("rc") version fallback. The installed version is normally resolved
# from the GitHub API at runtime (tasks/rustfs_client.yml), but that lookup is
# non-fatal: on a 403 rate-limit answer (anonymous API = 60 req/h per source IP)
# or any other failure the role falls back to this pin, so a run never dies on
# GitHub's quota. Set github_api_token (group_vars/all/vault/github.yml) to lift
# the limit to 5000 req/h. Bump this pin after checking the latest release with:
#   curl -s "https://api.github.com/repos/rustfs/cli/releases?per_page=1" | jq -r '.[0].tag_name'
# NOTE: keep the leading "v" (the tag is "v0.1.25"); it is part of the release
# asset filename. The comparison against `rc --version` strips it.
rustfs_rc_version_fallback: "v0.1.25"
