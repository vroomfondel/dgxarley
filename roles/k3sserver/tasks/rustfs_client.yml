---
# Install rustfs-cli (rc) on all k3sservers
# Reference: /home/thiess/pythondev_workspace/ansible/roles/rustfs/tasks/install_rc.yml

# Version resolution is best-effort, never fatal. The GitHub releases API is
# anonymous unless github_api_token is set (group_vars/all/vault/github.yml),
# and anonymous means 60 req/h per SOURCE IP, shared with every other tool on
# this control node. Hitting that quota used to abort the whole play, so the
# lookup now carries failed_when: false and the role falls back to the pinned
# rustfs_rc_version_fallback (roles/k3sserver/defaults/main.yml).
# An empty token sends no Authorization header at all (a header with an empty
# bearer would make GitHub answer 401 instead of serving the anonymous quota).
- name: fetch latest rustfs-cli release tag from GitHub
  uri:
    url: https://api.github.com/repos/rustfs/cli/releases?per_page=1
    return_content: true
    headers: >-
      {{ {'Accept': 'application/vnd.github+json'}
         | combine({'Authorization': 'Bearer ' ~ _rustfs_gh_token}
                   if _rustfs_gh_token | length > 0 else {}) }}
  vars:
    _rustfs_gh_token: "{{ github_api_token | default('') | trim }}"
  register: rustfs_cli_github_releases
  delegate_to: localhost
  become: false
  check_mode: false
  failed_when: false

- name: set rustfs_rc_version from GitHub release, else from the pinned fallback
  set_fact:
    rustfs_rc_version: >-
      {{ (rustfs_cli_github_releases.json | first).tag_name
         if (rustfs_cli_github_releases.status | default(0)) == 200
            and (rustfs_cli_github_releases.json | default([]) | length) > 0
         else rustfs_rc_version_fallback }}

- name: warn that the rustfs-cli release lookup fell back to the pin
  debug:
    msg: >-
      GitHub release lookup for rustfs/cli failed (HTTP
      {{ rustfs_cli_github_releases.status | default('n/a') }}:
      {{ rustfs_cli_github_releases.msg | default('no response') }}).
      Using the pinned {{ rustfs_rc_version }}. Set github_api_token to lift the
      anonymous 60 req/h GitHub rate limit.
  when: (rustfs_cli_github_releases.status | default(0)) != 200

- name: check current rc version
  command: /usr/local/bin/rc --version
  register: rc_current_version
  changed_when: false
  failed_when: false

- name: set rc arch mapping
  set_fact:
    rustfs_arch_rc: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: install rc binary
  when: >-
    rc_current_version.rc != 0 or
    (rustfs_rc_version | regex_replace('^v', '')) != (rc_current_version.stdout | default('') | split | last)
  block:
    - name: download rc tarball
      get_url:
        url: "https://github.com/rustfs/cli/releases/download/{{ rustfs_rc_version }}/rustfs-cli-linux-{{ rustfs_arch_rc }}-{{ rustfs_rc_version }}.tar.gz"
        dest: /tmp/rc.tar.gz
        mode: "0644"
        force: true

    - name: extract rc binary
      unarchive:
        src: /tmp/rc.tar.gz
        dest: /usr/local/bin/
        remote_src: true
        mode: "0755"
        owner: root
        group: root
        # tar keeps the archive's numeric UID/GID when run as root. Upstream
        # release tarballs carry the CI runner's UID (1001), which would make
        # root-executed binaries writable by a local account with that UID.
        extra_opts: ['--no-same-owner']

    - name: make rc binary executable
      file:
        path: /usr/local/bin/rc
        mode: "0755"

    - name: remove rc tarball
      file:
        path: /tmp/rc.tar.gz
        state: absent

- name: configure rc {{ rustfs_rc_alias }} alias
  command: >
    rc alias set {{ rustfs_rc_alias }}
    {{ rustfs_rc_endpoint }}
    {{ rustfs_rc_access_key }}
    {{ rustfs_rc_secret_key }}
  changed_when: true

- name: check if {{ rustfs_rc_alias }} backup bucket exists
  command: rc ls {{ rustfs_rc_alias }}/{{ rustfs_rc_backup_bucket }}
  register: bucket_check
  changed_when: false
  failed_when: false
  when:
    - isk3smaster is defined
    - isk3smaster

- name: create {{ rustfs_rc_alias }} backup bucket
  command: rc mb {{ rustfs_rc_alias }}/{{ rustfs_rc_backup_bucket }}
  when:
    - isk3smaster is defined
    - isk3smaster
    - bucket_check.rc | default(0) != 0