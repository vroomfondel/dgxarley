# Model profile: sparkarena/Minimax-M3-v0-NVFP4
# Loaded by include_vars in k8s_dgx role, merged into sglang_model_profiles.
#
# First NVFP4 quant of MiniMaxAI/MiniMax-M3 (sparkarena, for DGX Spark).
# ~428B total / ~23B active multimodal MoE, arch MiniMaxM3SparseForConditionalGeneration.
#   - 60 layers, 4 KV heads, 128 experts (4 active + 1 shared), first 3 layers dense.
#   - MiniMax Sparse Attention (MSA), max_position_embeddings 524288.
#   - NVFP4 group 16 from "quantization-tool" v1.0 (not modelopt), loads as modelopt_fp4.
#   - 245 GB weights, ~61 GB/GPU at TP=4.
#   - config declares an MTP head, but no M3 checkpoint ships MTP weights (HF discussion #5).
#
# Status:
#   - Text path verified 2026-06-17/18 on scitrera/dgx-spark-sglang-mm:v0.
#   - Since 2026-11-22 on the default image (upstream M3 support #28715), not re-verified.
#   - Multimodal path never exercised.
#   - Bench winner (case 12): 512K context, mfs 0.90, n16 agg 115.98, 16/16 clean.
#   - TESTLOG: TESTLOGS/sglang_nn4_tp4_ep1/minimax-m3-v0-nvfp4/
_model_profile:
  "sparkarena/Minimax-M3-v0-NVFP4":
    knowledge_cutoff: null  # not disclosed (HF card/blog/arXiv 2606.13392 silent)
    release_date: "2026-06-01"  # MiniMax-M3 base; official MiniMax blog (HF weights ~2026-06-07)
    info_url: "https://huggingface.co/sparkarena/Minimax-M3-v0-NVFP4"
    litellm_input_cost_per_token: 0.0000003   # $0.3 per 1M, OpenRouter, StreamLake/Novita MiniMax-M3 (base model; CoreWeave $0.23 in), checked 2026-10-10
    litellm_output_cost_per_token: 0.0000012  # $1.2 per 1M, OpenRouter, StreamLake/Novita MiniMax-M3, checked 2026-10-10
    # sglang_image: "scitrera/dgx-spark-sglang-mm:v0"  # pre-upstream-M3 override (#28715), dropped 2026-11-22, untested on default image
    nccl_transport: "roce"
    # 4 KV heads: TP=4 gives 1 KV head/rank, TP=3 impossible.
    tp_size: 4
    # = max_position_embeddings, rope_scaling null; 512K co-fit proven for pool allocation, not >100K inputs.
    context_length: 524288
    quantization: "modelopt_fp4"
    trust_remote_code: true
    moe_runner_backend: "flashinfer_cutlass"
    # fp8 KV crashed CUDA-graph capture on mm:v0 (MSA tl.dot rejects fp8e4nv); untested on the default image.
    kv_cache_dtype: "auto"
    # Higher = more KV; 0.60 OOMs, 0.90 needed for 512K.
    mem_fraction_static: "0.90"
    attention_backend: "flashinfer"
    fp4_gemm_backend: "flashinfer_cutlass"
    jit_max_jobs: 4
    # Eager is broken on cutlass_moe_fp4 paths.
    disable_piecewise_cuda_graph: false
    disable_cuda_graph: false
    cuda_graph_max_bs: 16
    pp_async_batch_depth: 0  # no-op at PP=1
    disable_deep_gemm: true
    reasoning_parser: "minimax-m3"
    tool_call_parser: "minimax-m3"
    num_experts: 128
    ep_size: 1
    recommended_sampling:
      temperature: 1.0   # generation_config.json
      top_p: 0.95        # generation_config.json
      top_k: 40
    # No M3 checkpoint ships MTP weights.
    speculative_enabled: false
    speculative_algo: NEXTN
    speculative_num_steps: 1
    speculative_num_draft_tokens: 2
    speculative_draft_model_path: ""
