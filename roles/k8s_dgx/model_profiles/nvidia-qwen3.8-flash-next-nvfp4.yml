---
# Model profile: nvidia/Qwen3.8-Flash-Next-NVFP4
# NOT RUN HERE: p66's TP=4 widening of the SM121 QSA _SUPPORTED_HEAD_TOPOLOGIES
# is replay-verified only, so a head-topology raise at backend init is that.
#
# Concurrency scaling, 4x GB10 TP=4/EP=4, 0.5.20-sm121, MTP on, measured
# 2026-09-23 (GSM8K prompts, temp 1.0 / top_p 0.95, max_tokens 4096, >=8 waves
# per level, aggregate normalised on busy time not wall clock):
#
#   streams   aggregate   per-stream   lat p50   lat p95   scaling   efficiency
#         1    51.5 t/s     55.6 t/s     4.1 s    17.9 s     1.00x       100 %
#         2    97.2 t/s     53.2 t/s     3.4 s    27.5 s     1.89x        94 %
#         4   146.3 t/s     39.6 t/s     6.0 s    35.6 s     2.84x        71 %
#         6   179.1 t/s     30.9 t/s     7.5 s    32.7 s     3.48x        58 %
#         8   193.9 t/s     24.7 t/s    10.0 s    56.1 s     3.76x        47 %
#        12   202.9 t/s     15.0 t/s    14.8 s   130.1 s     3.94x        33 %
#        16   215.4 t/s     11.9 t/s    19.7 s    67.9 s     4.18x        26 %
#
# The knee is at 4-6 streams. Accuracy is flat at 95.8-97.9 % across all seven
# levels. Cross-check: an independent 200-question run at 16 streams with
# max_tokens 8192 read 217.8 t/s against the 215.4 t/s above.
_model_profile:
  "nvidia/Qwen3.8-Flash-Next-NVFP4":
    knowledge_cutoff: null
    release_date: "2026-08-24"  # Qwen3.8-Flash-Next base; this NVFP4 export 2026-08-31
    info_url: "https://huggingface.co/nvidia/Qwen3.8-Flash-Next-NVFP4"
    litellm_input_cost_per_token: 0.00000015   # $0.15 per 1M, OpenRouter list price, PROXY: qwen/qwen3.8-flash (Flash-Next has no hosted listing), checked 2026-10-10
    litellm_output_cost_per_token: 0.00000047  # $0.47 per 1M, OpenRouter list price, PROXY: qwen/qwen3.8-flash (Flash-Next has no hosted listing), checked 2026-10-10
    # Pinned, not inherited: 0.5.18-sm121 has qwen4_exp but none of the
    # mixed-precision machinery, 0.5.19-sm121 has no qwen4_exp at all.
    sglang_image: "xomoxcc/dgx-spark-sglang:0.5.23-sm121"
    nccl_transport: "roce"
    nodes: [1, 2, 3, 4]
    tp_size: 4
    # EP=4 is REQUIRED at TP=4: moe_intermediate_size 640 / 4 = 160 per rank,
    # 2x160 = 320 is not 128-aligned -> NVFP4 gated-MoE padding assert. EP keeps
    # the full 640 per rank.
    ep_size: 4
    num_experts: 512
    enable_eplb: false
    enable_expert_distribution_metrics: false
    context_length: 262144
    # quant_algo is MIXED_PRECISION (NVFP4 W4A4 routed experts + FP8 block-scaled
    # MTP experts + per-tensor FP8 PLE table), NOT uniform NVFP4. The RadixArk
    # export of the same base needs modelopt_fp4 instead.
    quantization: "modelopt_mixed"
    trust_remote_code: true
    # fp8_e4m3 asserts inside the QSA decode call during warmup (#36545), and the
    # checkpoint bakes no KV scales.
    kv_cache_dtype: "auto"
    # Largely inert: QSA calls flash_attn directly and ignores --attention-backend.
    attention_backend: "flashinfer"
    mm_attention_backend: "triton_attn"
    fp4_gemm_backend: "flashinfer_cutlass"
    moe_runner_backend: "flashinfer_cutlass"
    disable_deep_gemm: true
    # TP=4 shards the 51 GB PLE n-gram table (VocabParallelEmbedding) to ~12.8
    # GB/rank, so offload buys nothing: on GB10 the pinned host allocation comes
    # out of the same unified pool and adds a gather hop. SGLang would auto-enable
    # it (CUDA + model dtype bfloat16), hence the explicit false. Set
    # ple_offload_embedding: true + ple_offload_backend: file for a single-node
    # TP=1 run, where the table has to leave the pool.
    ple_offload_embedding: false
    # Value the TP=4 RadixArk run of the same architecture settled on. This is a
    # post-weight KV reserve, not a fraction of total.
    mem_fraction_static: "0.82"
    # Drop the host page cache once the weights are loaded: on GB10 unified memory CUDA
    # counts only MemFree, so a cache full of weight files blocks a second CUDA context
    # (sglang-embed on spark2) from initialising.
    weight_loader_drop_cache_after_load: true
    # Forced to 64 by _qwen4_exp_overrides (compressed QSA addresses the cache as
    # full_slot // compress_ratio), which is also why extra_buffer below is
    # mandatory rather than an optimisation.
    page_size: 64
    mamba_scheduler_strategy: "extra_buffer"
    # Also a memory knob at depth: the QSA indexer allocates an fp32
    # [chunk x history] workspace per sparse layer per chunk. Drop to 1024 before
    # blaming a decode kernel for degraded long-context output.
    chunked_prefill_size: 4096
    max_running_requests: 32
    # cicc peaks at 4-7 GB per job on 0.5.23; 4 parallel jobs on a cold JIT cache OOM-killed spark2.
    jit_max_jobs: 2
    cuda_graph_max_bs: 32
    # bf16 halves the ssm cache; MTP accept len unchanged (validated TP1 only, SINGLE_CLUSTER_COMPARE.md)
    mamba_ssm_dtype: "bfloat16"
    # chat_template.jinja is byte-identical to the RadixArk export. Thinking is on
    # by default at xhigh; --reasoning-parser auto resolves to qwen3.
    reasoning_parser: "qwen3"
    # The only values the template accepts. SGLang's request schema is wider, so
    # high/max/minimal pass pydantic and then raise_exception() = HTTP 400.
    reasoning_efforts: ["xhigh", "medium", "low"]
    tool_call_parser: "qwen3_coder"
    recommended_sampling:  # from generation_config.json
      temperature: 1.0
      top_p: 0.95
      top_k: 20
    # In-checkpoint FP8 MTP head, no external draft repo.
    # speculative_draft_model_quantization stays unset: the mixed-precision loader
    # resolves the head itself (qwen3_5_mtp._mtp_quant_config keeps the config
    # because mtp.* IS listed in quantized_layers).
    # num_draft_tokens 4 is a hard ceiling: QwenSparseAttnBackend raises above
    # indexer_compress_ratio (4).
    # WARNING: the RadixArk export of this architecture collapsed into runs of
    # token 0 with NEXTN on, at TP=4 (3/16) AND at TP=2 with the #36845 kernel
    # (4/16). Enabled here because this is a different code path (FP8 head +
    # mixed-precision dispatch, plus the branch's GB10 NEXTN fix c8457de59a) and
    # upstream gated GSM8K 195/200 with MTP on this checkpoint on one Spark.
    # Run the 32-prompt collapse probe on first boot; rollback is this one line.
    speculative_enabled: true
    # Without this the draft inherits moe_runner_backend from the target
    # (overrides.py::_speculative_moe_runner_default), and the differently
    # quantized MTP experts then fault in the Triton fused-MoE kernel: the
    # dispatcher skips the EP global->local expert-id remap that path needs.
    # SGLang's own protective triton default is gated on is_hip + DeepSeek
    # (overrides.py:905-950), so CUDA/Qwen never gets it -- upstream #30209.
    # Not cutlass: sgl_kernel has no fp8_blockwise_scaled_grouped_mm for sm121
    # (measured 2026-09-23, its arch assert is right, not merely conservative).
    speculative_moe_runner_backend: triton
    # EAGLE, not NEXTN: identical worker (NEXTN is in _RESERVED_ALIASES and
    # from_string maps it to EAGLE; the enum has no NEXTN member any more), but
    # adaptive_unsupported_reason() compares the server-args STRING against
    # ("EAGLE", "EAGLE3"). The resolution pipeline does normalize NEXTN first, so
    # both work today; pinning EAGLE makes it independent of that ordering.
    # The in-checkpoint MTP head is still found: Qwen4ExpForConditionalGeneration
    # is in the _handle_eagle_family arch list that resolves
    # speculative_draft_model_path to model_path.
    speculative_algo: EAGLE
    # Starting value only while adaptive is on; a slot whose candidate_steps lack it
    # starts at its middle candidate instead (v0.5.21).
    speculative_num_steps: 2
    # MUST stay 1: adaptive is disabled for topk > 1.
    speculative_eagle_topk: 1
    # Overridden at init to speculative_num_steps + 1 while adaptive is on. Kept
    # so the value is right if adaptive is ever turned off.
    speculative_num_draft_tokens: 3
    # Retunes num_steps per batch-size tier from an EMA of the observed accept
    # length. It tunes steps only; draft tokens follow as steps + 1.
    # Images <= 0.5.20 crash at capture with "Unsupported moe_runner_backend ...
    # Use flashinfer_cutlass instead" when speculative_moe_runner_backend differs
    # from moe_runner_backend (upstream #38795). The fix #38932 is in v0.5.21:
    # adaptive with the tiers below booted clean on the cluster 2026-10-10 and ran
    # at accept len 3.1 vs 2.5 for fixed 2/1/3, with tighter rep-to-rep spread;
    # throughput gain vs fixed 2/1/3 not proven beyond drift (see TESTLOGS/
    # sglang_nn4_tp4_ep4/qwen-3.8-flash-next-nvfp4/, "Definitive A/B" section).
    # Tree drafting (eagle_topk > 1) is impossible here: "Qwen4-Exp QSA MTP
    # currently supports speculative_eagle_topk=1" (0.5.21).
    speculative_adaptive: true
    # candidate_steps capped at 3 ON PURPOSE: draft tokens are steps + 1 and
    # QwenSparseAttnBackend raises above indexer_compress_ratio (4). SGLang's
    # own defaults go up to 7 on the BS1 tier, which would trip that. 0 = drop
    # speculation entirely for that tier.
    # A batch uses the LARGEST key <= its (cuda-graph-padded) size, so with
    # max_running_requests 32: bs 1-7 -> "1", bs 8-30 -> "8", bs 31-32 -> "32".
    speculative_adaptive_config:
      "1": {candidate_steps: [1, 2, 3]}
      "8": {candidate_steps: [1, 2, 3]}
      "32": {candidate_steps: [1, 2]}
