---
# Tune fused MoE Triton kernel configs for the GPU on spark1.
# Sweeps ~1280 kernel configurations (block sizes, warp counts, pipeline stages)
# and writes the optimal config as a JSON file. SGLang reads these at runtime
# via SGLANG_MOE_CONFIG_DIR to avoid "Using default MoE kernel config" warnings.
#
# Usage:
#   ansible-playbook k8s_dgx.yml --tags sglang_tune_moe
#   ... -e sglang_tune_dtype=fp8_w8a8 -e sglang_tune_block_shape=128,128 -e '{"sglang_tune_batch_sizes":[1,2,4]}'
# Each finished batch size lands in <moe_config_dir>/tune_partial/<id>.jsonl (+ merged <id>.json snapshot);
# a rerun of an interrupted Job resumes from it (-e sglang_tune_resume=false starts fresh).
#
# Prerequisites:
# - Model must be downloaded (run hf_preload first)
# - SGLang pods should be scaled to 0 (avoid GPU contention / measurement noise)
# - After completion, redeploy SGLang to pick up the new SGLANG_MOE_CONFIG_DIR env var

- name: Create SGLang MoE tuning script ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: sglang-tune-moe-script
        namespace: "{{ sglang_namespace }}"
      data:
        tune_moe.sh: "{{ lookup('file', role_path ~ '/files/sglang_tune_moe.sh') }}"
        tune_moe_patch.py: "{{ lookup('file', role_path ~ '/files/sglang_tune_moe_patch.py') }}"

- name: Delete existing SGLang MoE tuning Job
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: sglang-tune-moe
    namespace: "{{ sglang_namespace }}"

- name: Deploy SGLang MoE tuning Job
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: sglang-tune-moe
        namespace: "{{ sglang_namespace }}"
        labels:
          app: sglang-tune-moe
      spec:
        ttlSecondsAfterFinished: 3600
        backoffLimit: 0
        template:
          metadata:
            labels:
              app: sglang-tune-moe
          spec:
            enableServiceLinks: false
            nodeSelector:
              spark-id: "1"
            restartPolicy: Never
            containers:
              - name: tune
                image: "{{ sglang_image }}"
                command: ["/bin/bash", "/scripts/tune_moe.sh"]
                env:
                  - name: SGLANG_MODEL
                    value: "{{ sglang_model }}"
                  - name: TP
                    value: "{{ sglang_tp | string }}"
                  - name: EP
                    value: "{{ sglang_ep | string }}"
                  - name: HF_TOKEN
                    value: "{{ hf_token }}"
                  - name: HF_HUB_DISABLE_XET
                    value: "{{ hf_hub_disable_xet | default(0) | string }}"
                  - name: HF_HUB_DISABLE_TELEMETRY
                    value: "{{ hf_hub_disable_telemetry | default(1) | string }}"
                  - name: HF_XET_HIGH_PERFORMANCE
                    value: "{{ '0' if (hf_hub_xet_disable_high_performance | default(0) | int) else '1' }}"
                  - name: HF_XET_NUM_CONCURRENT_RANGE_GETS
                    value: "{{ hf_xet_num_concurrent_range_gets | default(16) | string }}"
                  - name: HF_XET_RECONSTRUCT_WRITE_SEQUENTIALLY
                    value: "{{ hf_xet_reconstruct_write_sequentially | default(0) | string }}"
                  - name: HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT
                    value: "{{ hf_xet_reconstruction_download_buffer_limit | default('2gb') | string }}"
                  - name: HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE
                    value: "{{ hf_xet_reconstruction_download_buffer_size | default('1gb') | string }}"
                  - name: HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE
                    value: "{{ hf_xet_reconstruction_download_buffer_perfile_size | default('256mb') | string }}"
                  - name: HF_XET_RECONSTRUCTION_MIN_PREFETCH_BUFFER
                    value: "{{ hf_xet_reconstruction_min_prefetch_buffer | default('256mb') | string }}"
                  - name: HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS
                    value: "{{ hf_xet_data_max_concurrent_file_downloads | default(2) | string }}"
                  - name: MOE_CONFIG_DIR
                    value: "{{ sglang_moe_config_dir }}"
                  - name: HF_CACHE_HOST_PATH
                    value: "{{ hf_cache_path }}"
                  - name: RSYNC_TARGETS
                    # Empty when hf_hub_cache_on_juicefs → the tune script no-ops the rsync fan-out
                    # (moe_configs already lands on the shared JuiceFS namespace).
                    value: "{{ '' if hf_hub_cache_on_juicefs | bool else (range(2, sglang_nnodes | int + 1) | map('string') | map('regex_replace', '^(.+)$', 'spark\\1') | map('extract', hostvars, 'ansible_host') | join(',')) }}"
                  - name: FORCE_RETUNE
                    value: "{{ sglang_force_retune | default('false') }}"
                  - name: SGLANG_TUNE_BRANCH
                    value: "{{ sglang_tune_branch | default('v' ~ (sglang_image.split(':')[-1] | regex_replace('-sm[0-9]+.*$', ''))) }}"
                  - name: TUNE_DTYPE
                    value: "{{ sglang_tune_dtype | default('auto') }}"
                  - name: TUNE_BLOCK_SHAPE
                    value: "{{ (sglang_tune_block_shape | default('')) if (sglang_tune_block_shape | default('')) is string else (sglang_tune_block_shape | join(',')) }}"
                  - name: TUNE_BATCH_SIZES
                    value: "{{ (sglang_tune_batch_sizes | default([])) if (sglang_tune_batch_sizes | default([])) is string else (sglang_tune_batch_sizes | default([]) | join(' ')) }}"
                  - name: TUNE_RESUME
                    value: "{{ sglang_tune_resume | default(true) | bool | string | lower }}"
                  - name: PYTHONUNBUFFERED
                    value: "1"
                  - name: RAY_DEDUP_LOGS
                    value: "0"
                resources:
                  limits:
                    nvidia.com/gpu: "1"
                securityContext:
                  privileged: true
                volumeMounts:
                  - name: hf-cache
                    mountPath: /root/.cache/huggingface
                    # HostToContainer when JuiceFS-backed (survive a FUSE remount);
                    # None for a plain local dir. Same gate as the SGLang pods.
                    mountPropagation: "{{ 'HostToContainer' if hf_hub_cache_on_juicefs | bool else 'None' }}"
                  - name: tune-script
                    mountPath: /scripts
                    readOnly: true
                  - name: ssh-keys
                    mountPath: /root/.ssh
                    readOnly: true
            volumes:
              - name: hf-cache
                hostPath:
                  # hf_hub_cache_on_juicefs: write moe_configs straight into the shared
                  # JuiceFS (its root maps onto /root/.cache/huggingface) vs local
                  # NVMe. When on JuiceFS the rsync fan-out is skipped
                  # (RSYNC_TARGETS='') because every node already sees this write.
                  path: "{{ hf_cache_juicefs_root if hf_hub_cache_on_juicefs | bool else hf_cache_path }}"
                  type: "{{ 'Directory' if hf_hub_cache_on_juicefs | bool else 'DirectoryOrCreate' }}"
              - name: tune-script
                configMap:
                  name: sglang-tune-moe-script
                  defaultMode: 0755
              - name: ssh-keys
                hostPath:
                  path: /root/.ssh
                  type: Directory
