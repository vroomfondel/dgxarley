---
# roles/common/defaults/main.yml

# Postfix relayhost - set to empty string for direct delivery
postfix_relayhost: "[mail.example.com]"
# Relay alias: with postfix_relay_alias_ip set, /etc/hosts gets "<ip> <alias>" so that
# postfix_relayhost: "[mailrelay]" stays identical on every host while the address varies per host
# (nodes -> their master, the master -> the ops hub's tunnel address). Empty = no entry (an existing
# alias line is removed). main.cf uses smtp_host_lookup = dns, native so the alias resolves.
postfix_relay_alias: "mailrelay"
postfix_relay_alias_ip: ""
# Deferred mail waits this long for the relay before it bounces to the local sender (Postfix default 5d)
postfix_queue_lifetime: "5d"
# Clients allowed to relay (besides loopback): the networks the firewall trusts, never the port-forwarded customer LAN.
postfix_mynetworks: "{{ (localnets | default([]) + localnets_k3sserver | default([])) | map(attribute='cidr') | list }}"

# docker-ce-cli needs Docker's apt repo
install_docker_cli: false

# AppArmor removal - set to true for cloud/dns servers
deinstall_apparmor: false

# Opt-in OVS removal on hosts with wantsopenvswitch false: -e openvswitch_teardown=true (refuses while bridges exist).
openvswitch_teardown: false

# bottom (btm) system monitor — NOT in Ubuntu apt, installed from the GitHub
# release .deb. Pin the version here (tag has no leading "v"). Asset naming is
# `bottom-musl_<version>-1_<arch>.deb`; arch is derived from ansible_architecture
# (x86_64→amd64 on k3smaster, aarch64→arm64 on the sparks).
# curl -s https://api.github.com/repos/ClementTsang/bottom/releases/latest | jq -r '.tag_name'
bottom_version: "0.14.9"

# yq (mikefarah/yq, the Go YAML processor — NOT the apt kislyuk jq-wrapper).
# Ships only a static binary (no .deb), so it's fetched to /usr/local/bin. Pin
# the version here (tag HAS a leading "v"); arch derived from ansible_architecture.
# curl -s https://api.github.com/repos/mikefarah/yq/releases/latest | jq -r '.tag_name'
yq_version: "v4.54.1"

# smartd monitoring
smartd_mail_recipients: "root,admin@example.com"
smartd_devices: []  # Override per host in hosts.yml

# iptables (overridden by vault)
iptables_xosrc_ips: []
iptables_lifeline_ips: []
iptables_k3s_external_ips: []
# TCP ports open to every source (the router's port forwards); localnets stays the internal LAN.
iptables_public_tcp_ports: "{{ lan_ingress.tcp_ports | default([]) + lan_ingress.tcp_port_map | default([]) | map(attribute='to_port') | list if (lan_ingress.enabled | default(false) | bool and inventory_hostname == lan_ingress.target_host | default('')) else [] }}"
iptables_static_dns_ips: []
# Sources the ops tunnel may open connections from (CIDRs); [] = the whole ops_wireguard.ops_subnet (hub peer included).
ops_wireguard_trusted_sources: []
# Host-level SGLang from scripts/run_standalone.sh (podman --network=host), opened to localnets
standalone_sglang_firewall_enabled: false
standalone_sglang_port: 30000

# DynDNS hostname for ipset updates (overridden by vault)
dyndns_hostname: "dyn.example.com"

# WiFi access points for netplan (overridden by vault)
wifi_access_points: []

# Podman unqualified image search registries (containers-registries.conf v2).
# A single entry keeps short-name resolution unambiguous and suppresses Podman's
# interactive registry-selection prompt. Applied only when `wantspodman: true`.
podman_unqualified_search_registries:
  - docker.io
podman_short_name_mode: permissive

# Static Podman overlay (mgoltzsche/podman-static). When true, a fully static rootful
# podman stack (podman + crun/runc/conmon/netavark/aardvark-dns/fuse-overlayfs/pasta +
# quadlet + systemd units + default etc/containers configs) is installed under
# /usr/local, which wins on PATH over the apt /usr/bin/podman. The apt podman/buildah
# packages STAY installed as the system-dependency base — they pull iptables (netavark
# hard-dep for bridge NAT/port-forward), newuidmap/slirp4netns, buildah and seed
# subuid/subgid; the static bundle ships none of those. Enable per host/group
# (host_vars/group_vars) — default false = no change anywhere until opted in.
# Upstream containers/podman ships NO self-contained static bundle, so mgoltzsche is
# the only practical source and it lags upstream by a few weeks; check for a newer
# arm64 bundle before bumping: https://github.com/mgoltzsche/podman-static/releases
podman_static_enabled: true
# curl -s https://api.github.com/repos/mgoltzsche/podman-static/releases/latest | jq -r '.tag_name'
# Deploy a bump: ansible-playbook common.yml --tags podman --limit dgxsparks  (single host: --limit spark5)
podman_static_version: "6.1.4"
# Bump together with podman_static_version (a mismatch fails the download); "" skips verification for that arch.
# curl -s https://api.github.com/repos/mgoltzsche/podman-static/releases/tags/v<VERSION> | jq -r '.assets[] | select(.name=="podman-linux-arm64.tar.gz") | .digest'
podman_static_sha256:
  arm64: "c106d09d7524209ce01eb3a02a7e621e9c55ec31d0fada48439cf77aa07afdb6"
  amd64: "9dd51073fac5a1742f88cf3caff5554615cb4d67ba554d25e8807be635547af5"

# Purge the (now shadowed) apt podman + its orphaned rootless deps once pure-static is
# proven working. OPT-IN + only acts when podman_static_enabled: apt podman survives as
# a fallback until you deliberately flip this. Removes exactly podman + catatonit/
# conmon/slirp4netns/libslirp0/passt (all orphaned after podman goes — the static
# bundle ships its own equivalents under /usr/local, and rootful uses netavark not
# slirp/passt). buildah is KEPT (separate apt pkg). Runs AFTER the verify step, so a
# broken static install never strands the host with no podman at all.
podman_apt_purge: false

# NFS server exports — only applied when `isnfsmaster: true`.
# Schema: list of { path, clients: [{ cidr, options? }], owner?, group?, mode? }
# Define in host_vars/<host>/vault/ (e.g. host_vars/k3smaster/vault/nfs.sops.yml).
nfs_exports: []
nfs_exports_default_options: "rw,sync,no_subtree_check,no_root_squash"

# sysctls for tasks/mptcp.yml, written 1:1 to /etc/sysctl.d/60-mptcp.conf; keys the
# kernel does not have are skipped. Empty dict = no-op.
mptcp_sysctls:
  net.mptcp.enabled: 0
  net.ipv4.tcp_migrate_req: 0

# iptables.sh: raw/PREROUTING drop of IPv4 TCP carrying IP options (CVE-2026-98432, Red Hat mitigation)
iptables_drop_tcp_ip_options: true

# 00- drop-in wins via sshd first-match over installer drop-ins
common_ssh_password_auth: false
