---
# Public dummy/example values. Real values live in group_vars/all/vault/<topic>.sops.yml of the private sops overlay.
# QSFP IPs for NCCL bootstrap
qsfp_ip_spark1: "{{ hostvars['spark1'].qsfp_ip }}"
qsfp_ip_spark2: "{{ hostvars['spark2'].qsfp_ip }}"
qsfp_ip_spark3: "{{ hostvars['spark3'].qsfp_ip }}"
qsfp_ip_spark4: "{{ hostvars['spark4'].qsfp_ip }}"


# SR-IOV: create Virtual Functions on the QSFP PF used by Multus.
# Used by both dgx_prepare (creates VFs on hosts) and k8s_dgx (selects NADs).
qsfp_sriov_enabled: true
# VF interface name prefix (kernel drops "npN" from VF names: enp1s0f0np0 → enp1s0f0vX)
qsfp_sriov_vf_prefix: "enp1s0f0"

# Dual-rail QSFP. The GB10 gives the ConnectX-7 only PCIe Gen5 x4 per link, so the NIC runs in
# multi-host mode over two x4 links, each good for ~100 Gbit/s. Every QSFP cage therefore shows up
# twice, once per link: for the cabled cage rail 1 = enp1s0f0np0 (PCI 0000:01:00.0, RDMA rocep1s0f0)
# and rail 2 = enP2p1s0f0np0 (PCI 0002:01:00.0, RDMA roceP2p1s0f0). One netdev / one RDMA device
# tops out at ~92-98 Gbit/s although the cable links at 200G; only RoCE over BOTH rails reaches
# ~185-190 Gbit/s. With dual-rail on, dgx_prepare puts an IP on the rail-2 PF and creates the same
# VFs (+ IPs) on rail 2 as on rail 1, pods get the matching rail-2 VF as a second Multus interface
# (net2, NAD qsfp-r2-vfN) and NCCL_IB_HCA lists both rails. NCCL bootstrap and the socket
# transport stay on rail 1 (net1).
qsfp_dualrail_enabled: true
# Rail-2 VF interface name prefix (enP2p1s0f0np0 → enP2p1s0f0vX, RDMA device roceP2p1s0f0vX)
qsfp_sriov_vf2_prefix: "enP2p1s0f0"
# Rail-2 IPs are the rail-1 IPs with the third octet shifted by this offset
# (10.10.10.1 → 10.10.11.1, 10.10.100.1 → 10.10.101.1). Own /24 per rail, so the kernel resolves
# each rail's RoCEv2 GID through that rail's netdev instead of whichever one owns a shared subnet.
qsfp_rail2_octet3_offset: 1

# SR-IOV VF assignments per deployment.
# Each deployment gets its own VF index + dedicated IPs per spark node.
# This allows multiple engines to run on different VFs simultaneously.
# vf: which VF index (maps to NAD qsfp-vfN and interface <prefix>vN)
# head_ip: QSFP IP for the head pod (rank 0, spark1)
# worker_ip1..N: QSFP IPs for worker pods (rank 1..N, spark2..N+1)
qsfp_sriov_assignments:
  sglang:
    vf: 0
    head_ip: "10.10.10.201"
    worker_ip1: "10.10.10.202"
    worker_ip2: "10.10.10.203"
    worker_ip3: "10.10.10.204"
  sglang_coder:
    vf: 4
    head_ip: "10.10.10.241"
    worker_ip1: "10.10.10.242"
    worker_ip2: "10.10.10.243"
    worker_ip3: "10.10.10.244"
  sglang_vision:
    vf: 5
    head_ip: "10.10.10.251"
    worker_ip1: "10.10.10.252"
    worker_ip2: "10.10.10.253"
    worker_ip3: "10.10.10.254"
  sglang_res2:
    vf: 6
    head_ip: "10.10.10.061"
    worker_ip1: "10.10.10.062"
    worker_ip2: "10.10.10.063"
    worker_ip3: "10.10.10.064"
  vllm:
    vf: 1
    head_ip: "10.10.10.205"
    worker_ip1: "10.10.10.206"
    worker_ip2: "10.10.10.207"
    worker_ip3: "10.10.10.208"
  sglang_shard:
    vf: 2
    head_ip: "10.10.10.209"
    worker_ip1: "10.10.10.210"
    worker_ip2: "10.10.10.211"
    worker_ip3: "10.10.10.212"
  vllm_shard:
    vf: 3
    head_ip: "10.10.10.213"
    worker_ip1: "10.10.10.214"
    worker_ip2: "10.10.10.215"
    worker_ip3: "10.10.10.216"
  iperf_test:
    vf: 7
    server_ip: "10.10.10.241"
    client_ip: "10.10.10.242"
