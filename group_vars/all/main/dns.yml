---
# Public dummy/example values. Real values live in group_vars/all/vault/<topic>.sops.yml of the private sops overlay.
# DNS backends for RFC2136 updates: one bundle per authoritative server + zone + TSIG key. The vault copy holds the
# same map with literal values (dicts replace, no merge). `zone` is the UPDATE zone (parent of the records), `ingress_ip`
# the address A records in that zone point at. certmanager_acme_issuers entries reference a backend by key.
nsupdate_servers:
  primary:
    server: "198.51.100.1"
    zone: "example.com"
    tsig_key_name: "dgx.example.com"
    tsig_key_secret: "CHANGEME_BASE64_TSIG_KEY"
    tsig_algorithm: "hmac-sha256"
    ttl: 3600
    ingress_ip: "192.168.124.100"
  secondary:
    server: "198.51.100.1"
    zone: "example.eu"
    tsig_key_name: "ddns-key.example.eu"
    tsig_key_secret: "CHANGEME_BASE64_TSIG_KEY"
    tsig_algorithm: "hmac-sha256"
    ttl: 900
    ingress_ip: "203.0.113.10"
  tenant:
    server: "198.51.100.1"
    zone: "example.com"
    tsig_key_name: "acme-tenants.example.com"
    tsig_key_secret: "CHANGEME_BASE64_TSIG_KEY"
    tsig_algorithm: "hmac-sha256"
    ttl: 60
    ingress_ip: "192.168.124.100"

# Backend the record tasks use via module_defaults (k8s_infra.yml, k8s_dgx.yml); apps with their own zone pick
# another backend by key (matrix_dns_backend).
nsupdate_default_backend: primary
nsupdate_default: "{{ nsupdate_servers[nsupdate_default_backend] }}"

# cert-manager ACME account email (Let's Encrypt registration)
certmanager_letsencrypt_email: "admin@example.com"

# cert-manager ACME (Let's Encrypt) DNS01 ClusterIssuers, one ClusterIssuer + TSIG Secret each
# (roles/k8s_infra/tasks/core/certmanager.yml). A Certificate selects an issuer by issuerRef.name.
#   name             — ClusterIssuer name
#   nsupdate         — key into nsupdate_servers (server, TSIG key, algorithm)
#   dns_zones        — cert hostname suffixes this issuer solves (selector.dnsZones), not the UPDATE zone
#   tsig_secret_name — k8s Secret holding the TSIG key (keep stable)
#   private_key_ref  — ACME account key Secret (renaming re-registers the account)
#   optional: email, acme_server, nameserver, tsig_algorithm
# An empty dns_zones (no tenants yet) skips the entry.
certmanager_acme_issuers:
  - name: letsencrypt-production
    nsupdate: primary
    dns_zones: ["{{ dns_external_domain_suffix }}"]
    tsig_secret_name: tsig-secret
    private_key_ref: acme-issuer-key-production
  - name: letsencrypt-secondary
    nsupdate: secondary
    dns_zones: ["example.eu"]
    tsig_secret_name: tsig-secret-secondary
    private_key_ref: acme-issuer-key-secondary
  - name: letsencrypt-tenant
    nsupdate: tenant
    dns_zones: "{{ tenants.values() | map(attribute='domain') | unique | list }}"
    tsig_secret_name: tsig-secret-tenant
    private_key_ref: acme-issuer-key-tenant
