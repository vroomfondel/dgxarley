---
# Public dummy/example values. Real values live in group_vars/all/vault/<topic>.sops.yml of the private sops overlay.
# Gate for the PROXY-protocol bind on the k3s master: the upstream ingress hub connects here and forwards the real client address.
# source_ips are the hub peers allowed to connect (INPUT accept on port only), bind_address is the master tunnel address.
hub_ingress:
  enabled: false
  bind_address: ""
  port: 8443
  source_ips: []

# Mail ports the hub passes through raw: <bind_address>:<gate_port> accept-proxy -> 127.0.0.1:<nodeport> send-proxy-v2
# -> roles/k8s_infra apps/postfix.yml (smtp, submission(s)) / apps/dovecot.yml (imap(s)). gate_port must match the hub's kikube_hub_mail_ingress.
# The vault sets hub_ingress_mail (e.g. { smtp: { enabled: true } }), merged over the defaults.
hub_ingress_mail_defaults:
  smtp:        { enabled: false, gate_port: 8025, nodeport: 30025 }
  submissions: { enabled: false, gate_port: 8465, nodeport: 30465 }
  submission:  { enabled: false, gate_port: 8587, nodeport: 30587 }
  imap:        { enabled: false, gate_port: 8143, nodeport: 30143 }
  imaps:       { enabled: false, gate_port: 8993, nodeport: 30993 }
hub_ingress_mail: {}
hub_ingress_mail_services: "{{ hub_ingress_mail_defaults | combine(hub_ingress_mail, recursive=True) }}"
