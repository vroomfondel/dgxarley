---
# Public dummy/example values. Real values live in the same-named vault/<topic>.sops.yml of the private sops overlay.
deinstall_apparmor: true

# Install K3s (server or agent) on this host. This is the ONE place the flag is
# turned on: every member of `k3sserver` becomes a cluster node, while the task-side
# conditionals in roles/k3sserver default it to false, so nothing installs k3s
# without this group var. Set to false inline in hosts.yml for a host that must keep
# the group's NON-k3s semantics but must not join the cluster --
# the firewall (k3snodes ipset, the k3s rule block and the rc.local boot path in
# roles/common/templates/*), `localnets_k3sserver`, ulogd2, ip_nonlocal_bind and
# the storage.yml host pattern all key off group membership, not off this flag.
# Currently false only on spark5 (podman build/verify host). Gates the
# ensure_cgroups + k3sinstall imports in roles/k3sserver/tasks/main.yml; the rest
# of the role (NFS, crontab, rsyslog, rustfs-cli, sops+age) still runs.
install_k3s: true

# K3s Master
k3smasterip: "{{ hostvars[k3s_master_node_hostname].k3s_node_ip }}"
k3s_master_node_hostname: "k3smaster"
# API server URL for local kubeconfig (K3s API binds to VLAN 191)
kubeconfig_api_server: "https://{{ k3smasterip }}:6443"
# Cluster CIDRs
cluster_cidr: "10.68.0.0/16"
service_cidr: "10.69.0.0/16"

# Traefik: proxies whose X-Forwarded-* headers the web/websecure entrypoints trust.
# Traefik discards inbound Forwarded headers from any peer NOT listed here and sets
# X-Forwarded-For to the peer IP instead. With the list empty, a backend behind a
# reverse proxy therefore only ever sees the proxy IP, never the real client.
# List only IPs that are genuinely trustworthy: a listed peer may claim any client
# IP it likes. Empty = trust nobody (Traefik default).
# The peer Traefik matches is the PROXY-protocol source reported by the HAProxy in
# front of it (roles/k3sserver/templates/etc_haproxy_haproxy.cfg.j2), not the raw TCP
# peer. Kept deliberately separate from iptables_k3s_external_ips: a firewall
# exception must not silently grant header trust as well.
traefik_forwarded_trusted_ips: []
# Pod CIDR for the localnets/k3spods ipsets
localnets_k3sserver:
  - { cidr: "{{ cluster_cidr }}", comment: "k3s-pods" }
# Keine spezielle Edge-Infrastruktur
providespxeboot: false
providesmqttexternal: false
providescoturn: false
iswireguardhost: false
